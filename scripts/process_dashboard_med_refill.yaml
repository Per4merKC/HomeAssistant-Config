---
process_dashboard_med_refill:
  alias: "Process Dashboard Med Refill"
  sequence:
    - variables:
        # We add 'default' so the log stops complaining during startup
        med_id: "{{ med_id | default('') }}"
        counter_entity: "counter.{{ med_id }}_medicine_counter"
        refill_amount: "{{ states('input_number.dashboard_refill_qty') | int(30) }}"

    # We add a condition so the script doesn't try to run with an empty ID
    - condition: template
      value_template: "{{ med_id != '' }}"

    # 1. Set the counter to the new value based on the dashboard slider
    - action: counter.set_value
      target:
        entity_id: "{{ counter_entity }}"
      data:
        value: "{{ refill_amount }}"

    # 2. Reset the dashboard slider back to 30 for next time
    - action: input_number.set_value
      target:
        entity_id: input_number.dashboard_refill_qty
      data:
        value: 30

    # 3. Clear the alert from your phone so it doesn't sit there
    - action: notify.mobile_app_john_iphone
      data:
        message: "clear_notification"
        data:
          tag: "refill_{{ med_id }}"