---
text_notify_john:
  fields:
    title:
      name: "title"
      required: true
      selector:
        text:
    message:
      name: "Message"
      required: true
      selector:
        text:
          multiline: true
    data:
      name: "Data"
      default: {}
      required: false
      selector:
        object:
  icon: mdi:message-text
  sequence:
    - condition: state
      entity_id: input_boolean.john_sms
      state: "on"
    - service: notify.ios_john
      data:
        title: "{{ title }}"
        message: "{{ message }}"
        data: "{{ data | default({})  }}"
