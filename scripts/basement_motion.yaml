basement_motion_helper:
  alias: "Basement Motion Helper"
  description: "Helper script to manage basement motion-triggered actions with a timer."
  mode: restart
  sequence:
    - delay:
        minutes: 3
    - action: light.turn_off
      target:
        entity_id:
          - light.stairwell_light
          - light.laundry_light

basement_motion_timer:
  alias: "Basement Motion Timer"
  description: "Starts a timer to turn off basement lights after motion is detected."
  mode: restart
  sequence:
    - action: script.turn_off
      target:
        entity_id: script.basement_motion_helper
    - action: light.turn_on
      target:
        entity_id:
          - light.stairwell_light
          - light.laundry_light
    - action: script.turn_on
      target:
        entity_id: script.basement_motion_helper