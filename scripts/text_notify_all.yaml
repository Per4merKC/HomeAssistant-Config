---
text_notify_all:
  alias: "Notify All via IOS"
  description: "Notify John and Robert if allowed"
  fields:
    title:
      name: "title"
      required: true
      selector:
        text:
    message:
      name: "Message"
      required: true
      selector:
        text:
          multiline: true
    data:
      name: "Data"
      default: {}
      required: false
      selector:
        object:
  icon: mdi:forum
  sequence:
    - parallel:
        - sequence:
            - condition: state
              entity_id: input_boolean.john_sms
              state: "on"
            - service: notify.ios_john
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data: "{{ data | default({}) }}"
        - sequence:
            - condition: state
              entity_id: input_boolean.robert_sms
              state: "on"
            - service: notify.ios_robert
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data: "{{ data | default({}) }}"
