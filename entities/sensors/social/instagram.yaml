---
platform: rest
name: instagram_api
resource_template: !secret ig_url
method: GET
headers:
  # Desktop User-Agent is less likely to be flagged on the 'www' endpoint
  user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
  # Mandatory header for this specific API
  x-ig-app-id: "936619743392459"
  content-type: "application/json"
value_template: >
  {% if value_json is defined and value_json.data is defined and value_json.data.user is defined %}
    {{ value_json.data.user.edge_followed_by.count | int(0) }}
  {% else %}
    {{ states('sensor.instagram_api') | int(0) }}
  {% endif %}
# 86400 seconds = 24 hours. Don't poll more than once a day or you'll get IP banned.
scan_interval: 86400