switch:
  - name: smart_heater_logic
    unique_id: 7a577039-c704-4e8c-8464-559a1f25b032
    icon: mdi:thermometer
    state: >
      {% set current = states('sensor.refrigerator_temperature_air_temperature') | float(0) %}
      {% set target = state_attr('climate.kitchen_refrigerator', 'temperature') | float(37) %}
      {% set tolerance = states('input_number.refrigerator_tolerance') | float(2) %}
      {# Logic: Turn ON if temp is HIGHER than target + tolerance #}
      {{ current > (target + tolerance) }}
    turn_on:
      action: switch.turn_on
      target:
        entity_id: switch.refrigerator_power
    turn_off:
      action: switch.turn_off
      target:
        entity_id: switch.refrigerator_power