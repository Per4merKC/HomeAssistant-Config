---
switch:
  - name: smart_heater_logic
    unique_id: 7a577039-c704-4e8c-8464-559a1f25b032
    icon: mdi:thermometer
    state: >
      {% set current = states('sensor.refrigerator_temperature_air_temperature') | float %}
      {% set target = state_attr('climate.kitchen_refrigerator', 'temperature') | float %}
      {% set tolerance = states('input_number.refrigerator_tolerance') | float %}
      {{ current < (target - tolerance) }}
    turn_on:
      service: switch.turn_on
      target:
        entity_id: switch.refrigerator_power
    turn_off:
      service: switch.turn_off
      target:
        entity_id: switch.refrigerator_power