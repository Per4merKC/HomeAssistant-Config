---
substitutions:
  name: ep1-bath
  friendly_name: EP1 Bathroom

packages:
  Everything Smart Technology.Everything Presence One: !include packages/ep1-den/everything-presence-one-ble-rev1.6.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

ota:
  # Extend the manufacturer's existing port-3232 OTA server.
  # Require encrypted OTA, inheriting the existing API encryption key.
  - id: !extend ota_esphome
    encryption:

api:
  encryption:
    key: !secret esphome_encryption_key

web_server:
  port: 80
  auth:
    type: digest
    username: !secret web_server_username
    password: !secret web_server_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:

bluetooth_proxy:
  active: true
