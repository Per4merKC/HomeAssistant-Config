---
substitutions:
  devicename: waveshare-display
  upper_devicename: WaveShare-Display
  short_name: WaveShare

# Enable Home Assistant API
api:
  encryption:
    key: !secret esphome_encryption_key

captive_portal:

ch422g:
  - id: ch422g_hub

color:
  - id: color_blue
    red_int: 0
    green_int: 0
    blue_int: 255
    white_int: 0
  - id: color_teal
    red_int: 0
    green_int: 255
    blue_int: 255
    white_int: 0
  - id: color_orange
    red_int: 243
    green_int: 156
    blue_int: 18
    white_int: 0

display:
  - platform: rpi_dpi_rgb
    id: jarvis_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 14MHz #16MHz
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: false
    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30
    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1         #r3
        - 2         #r4
        - 42        #r5
        - 41        #r6
        - 40        #r7
      blue:
        - 14        #b3
        - 38        #b4
        - 18        #b5
        - 17        #b6
        - 10        #b7
      green:
        - 39        #g2
        - 0         #g3
        - 45        #g4
        - 48        #g5
        - 47        #g6
        - 21        #g7

esphome:
  name: ${devicename}
  friendly_name: ${short_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # CONFIG_COMPILER_OPTIMIZATION_PERF: y
      # CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      # CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # CONFIG_ESPTOOLPY_FLASHFREQ_120M: y #[should align with PSRAM]
      # CONFIG_ESPTOOLPY_FLASHMODE_QIO: y
      # CONFIG_FREERTOS_HZ: '1000'
      # CONFIG_IDF_EXPERIMENTAL_FEATURES: y #[should align with PSRAM]
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      # CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_SPIRAM_RODATA: y
      # CONFIG_SPIRAM_SPEED_120M: y #[should align with PSRAM]

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: roboto_h1
    size: 40
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: roboto_body
    size: 20

i2c:
  sda: GPIO08
  scl: GPIO09
  scan: True
  id: bus_a

image:
  - file: mdi:home-assistant
    id: img_ha
    resize: 200x200
  - file: mdi:controller
    id: img_controller
    resize: 200x200
  - file: mdi:cogs
    id: img_settings
    resize: 200x200

logger:

lvgl:
  displays:
    - jarvis_display
  pages:
    - id: welcome_page
      widgets:
        - label:
            align: CENTER
            text: "Honey Haus"

ota:
  - platform: esphome
    password: !secret ota_password

psram:
  mode: octal
  speed: 80MHz

switch:
  - platform: gpio
    name: "Display Backlight"
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false
    restore_mode: ALWAYS_ON
#   - platform: gpio
#     name: "Touch Reset"
#     pin:
#       ch422g: ch422g_hub
#       number: 1
#       mode:
#         output: true
#       inverted: false
#   - platform: gpio
#     name: "LCD Reset"
#     pin:
#       ch422g: ch422g_hub
#       number: 3
#       mode:
#         output: true
#       inverted: false


time:
  - platform: homeassistant
    id: homeassistant_time

touchscreen:
  platform: gt911
  id: my_touch
  interrupt_pin: GPIO4
  on_touch:
    - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );

web_server:
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
  include_internal: True
  port: 8080
  version: 3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: $short_name Fallback Hotspot
    password: !secret ap_password
