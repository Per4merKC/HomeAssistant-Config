---
substitutions:
  devicename: waveshare-display
  upper_devicename: WaveShare-Display
  short_name: WaveShare


esphome:
  name: ${devicename}
  friendly_name: ${short_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret esphome_encryption_key

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: $short_name Fallback Hotspot
    password: !secret ap_password

    