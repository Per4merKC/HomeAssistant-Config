---
substitutions:
  DEVICE_NAME: ws1-jarvis
  FRIENDLY_NAME: Jarvis Intervase (Waveshare 1)
  LOADING_COLOR: "000000"
  SCREEN_HEIGHT: "480"
  SCREEN_WIDTH: "800"

api:
  encryption:
    key: !secret esphome_encryption_key

captive_portal:

color:
  - id: color_blue
    blue_int: 255
    green_int: 0
    red_int: 0
    white_int: 0
  - id: color_teal
    blue_int: 255
    green_int: 255
    red_int: 0
    white_int: 0
  - id: color_orange
    blue_int: 18
    green_int: 156
    red_int: 243
    white_int: 0
  - id: loading_color
    hex: ${LOADING_COLOR}

display:
  - platform: rpi_dpi_rgb
    id: jarvis_display
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: ${SCREEN_WIDTH}
      height: ${SCREEN_HEIGHT}
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30
    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1 #r3
        - 2 #r4
        - 42 #r5
        - 41 #r6
        - 40 #r7
      blue:
        - 14 #b3
        - 38 #b4
        - 18 #b5
        - 17 #b6
        - 10 #b7
      green:
        - 39 #g2
        - 0 #g3
        - 45 #g4
        - 48 #g5
        - 47 #g6
        - 21 #g7
    pages:
      - id: initializing_page
        lambda: |-
          it.fill(id(loading_color));
          id(jarvis_idle).next_frame();
          it.image(${SCREEN_WIDTH} / 2, ${SCREEN_HEIGHT} / 2, id(jarvis_idle), ImageAlign::CENTER);
      - id: idle_page
        lambda: |-
          it.fill(id(loading_color));
          it.print(10, 10, id(roboto_h1), id(color_teal), "Initializing...");

esphome:
  name: ${DEVICE_NAME}
  friendly_name: ${FRIENDLY_NAME}
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1
  framework:
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
    type: esp-idf
    version: recommended

font:
  - file:
      family: Roboto
      type: gfonts
      weight: 900
    id: roboto_h1
    size: 40
  - file:
      family: Roboto
      type: gfonts
      weight: 900
    id: roboto_body
    size: 20

globals:
  - id: init_in_progress
    initial_value: "true"
    restore_value: false
    type: bool

  - id: showing_fullscreen_image
    initial_value: "false"
    restore_value: no
    type: bool

animation:
  - file: "images/jarvis_loading.gif"
    id: jarvis_idle
    resize: ${SCREEN_WIDTH}x${SCREEN_HEIGHT}
    type: RGB565

logger:

ota:
  - platform: esphome
    password: !secret ota_password

psram:
  mode: octal
  speed: 80MHz

time:
  - id: homeassistant_time
    platform: homeassistant

web_server:
  auth:
    password: !secret web_server_password
    username: !secret web_server_username
  #include_internal: True
  port: 80
  version: 3

wifi:
  ap:
    password: !secret ap_password
    ssid: "${DEVICE_NAME} Fallback Hotspot"
  password: !secret wifi_password
  ssid: !secret wifi_ssid
