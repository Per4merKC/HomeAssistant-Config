---
substitutions:
  devicename: m5stick
  upper_devicename: M5StickC

external_components:
  - source: github://martydingo/esphome-axp192
    components: [axp192]


esp32:
  board: m5stick-c
  framework: 
    type: esp-idf

esphome:
  name: $devicename
  # on_boot:
  #   - delay: 5s
  #   - lvgl.page.show: main_page
  platformio_options:
    upload_speed: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: $devicename Fallback Hotspot
    password: !secret ap_password

api:
  encryption:
    key: !secret esphome_encryption_key

captive_portal:

logger:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:

# AXP192 power management - must be present to initialize TFT power on
sensor:
  - platform: axp192
    model: M5STICKC
    address: 0x34
    i2c_id: bus_a
    update_interval: 30s
    battery_level:
      name: "M5Stick Battery Level"
      id: "m5stick_batterylevel"

  - platform: wifi_signal
    name: ${upper_devicename} WiFi Signal
    id: wifi_dbm

  - platform: uptime
    name: ${upper_devicename} Uptime

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO37
      inverted: true
    name: ${upper_devicename} Button A
    on_press:
      then:
        - light.turn_on: led1
    on_release:
      then:
        - light.turn_off: led1

  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: ${upper_devicename} Button B
    on_press:
      then:
        - light.turn_on: led1
    on_release:
      then:
        - light.turn_off: led1

light:
  - platform: monochromatic
    output:  builtin_led
    name: ${upper_devicename} Led
    id: led1

output:
  - platform: ledc
    pin: 10
    inverted: true
    id: builtin_led

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO15

i2c:
   - id: bus_a
     sda: GPIO21
     scl: GPIO22
     scan: True

time:
  - platform: homeassistant
    id: homeassistant_time

font:
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24

# 1.14 inch, 135*240 Colorful TFT LCD, ST7789v2
display:
  - platform:  ili9xxx
    model: st7789v
    id: assist_display
    dimensions:
      height: 240
      width: 135
      offset_height: 40
      offset_width: 52
    # backlight_pin: no
    cs_pin: GPIO5
    dc_pin: GPIO23
    reset_pin: GPIO18
    rotation: 90
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    # lambda: |-
    #   it.fill(id(m5_blue));
    #   it.print(80, 0, id(roboto_24), id(m5_white), TextAlign::TOP_CENTER, "M5Stick");
    #   it.strftime(0, 60, id(roboto_12), id(m5_white), TextAlign::BASELINE_LEFT, "%H:%M", id(homeassistant_time).now());

i2s_audio:
  id: bus_i2s
  i2s_lrclk_pin: G26
  i2s_bclk_pin: G0

microphone:
  - platform: i2s_audio
    i2s_din_pin: GPIO34
    i2s_audio_id: bus_i2s
    adc_type: external
    pdm: true
    id: mic

voice_assistant:
  microphone: mic

micro_wake_word:
  vad:
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    then:
      - voice_assistant.start:
          wake_word: !lambda return wake_word;

color:
  - id: m5_white
    red_int: 255
    green_int: 255
    blue_int: 255
  - id: m5_blue
    red_int: 3
    green_int: 169
    blue_int: 244
  - id: m5_orange
    red_int: 255
    green_int: 152
    blue_int: 0

lvgl:
  displays:
    - assist_display
  pages:
    - id: welcome_page
      widgets:
        - label:
            align: CENTER
            text: "Honey Haus"
