blueprint:
  name: AWTRIX NG - NFL Team Scoreboard
  author: Hank_the_Tank
  description: Local AWTRIX NG adaptation of the NFL scoreboard by Hank_the_Tank (fettesb). Requires the
    TeamTracker integration. Select AWTRIX NG MQTT devices; the blueprint reads their MQTT prefix sensors.
    The upstream source URL refers to the original AWTRIX 3 blueprint.
  domain: automation
  input:
    awtrix:
      name: AWTRIX Device
      description: Select AWTRIX NG devices with MQTT discovery enabled.
      selector:
        device:
          integration: mqtt
          manufacturer: Blueforcer
          multiple: true
    appname:
      name: Awtrix Application name
      description: This is the app name listed in the MQTT topic - it should be unique
      default: nflteamscore
      selector:
        text: {}
    message_duration:
      name: Message Duration ⏱️
      description: How long should the message remain on the screen (in seconds).
      selector:
        number:
          min: 0.0
          max: 300.0
          unit_of_measurement: sec
          step: 1.0
          mode: slider
      default: 15
    my_sensor:
      name: Football Sensor
      description: Select your Football Team Sensor
      selector:
        entity:
          filter:
          - integration: teamtracker
          multiple: false
  source_url: https://raw.githubusercontent.com/fettesb/Homeassistant_blueprints/main/Awtrix NFL Team
    Scoreboard/awtrix_nfl_team_scoreboard.yaml
variables:
  device_ids: !input 'awtrix'
  devices: |-
    {% set ns = namespace(devices=[]) %}
    {% for device_id in device_ids %}
      {% set entities = device_entities(device_id) | select('search', 'mqtt_prefix') | list %}
      {% set prefix = states(entities[0]) if entities else 'unknown' %}
      {% set ns.devices = ns.devices + [prefix] %}
    {% endfor %}
    {{ ns.devices | reject('match', 'unavailable|unknown') | list }}
  appname: !input 'appname'
  my_sensor: !input 'my_sensor'
  message_duration: !input 'message_duration'
  team_colors_0: '{{ state_attr(my_sensor, ''team_colors'')[0] }}'
  team_colors_1: '{{ state_attr(my_sensor, ''team_colors'')[1] }}'
  opponent_colors_0: '{{ state_attr(my_sensor, ''opponent_colors'')[0] }}'
  opponent_colors_1: '{{ state_attr(my_sensor, ''opponent_colors'')[1] }}'
  team_score: |-
    {% set raw_team_score = state_attr(my_sensor, 'team_score') %} {% if raw_team_score|int < 10 %}
      {{  "0" + raw_team_score|string }}
    {% else %}
        {{ raw_team_score|string }}
    {% endif %}
  opponent_score: |-
    {% set raw_opponent_score = state_attr(my_sensor, 'opponent_score') %} {% if raw_opponent_score|int < 10 %}
        {{ "0" + raw_opponent_score|string }}
    {% else %}
        {{ raw_opponent_score|string }}
    {% endif %}
  first_quarter: '["pixel", 12,7,"#ffffff"], ["pixel", 14,7,"#5F5F5F"], ["pixel", 17,7,"#5F5F5F"], ["pixel",
    19,7,"#5F5F5F"],'
  second_quarter: '["pixel", 12,7,"#ffffff"], ["pixel", 14,7,"#ffffff"], ["pixel", 17,7,"#5F5F5F"], ["pixel",
    19,7,"#5F5F5F"],'
  third_quarter: '["pixel", 12,7,"#ffffff"], ["pixel", 14,7,"#ffffff"], ["pixel", 17,7,"#ffffff"], ["pixel",
    19,7,"#5F5F5F"],'
  fourth_quarter: '["pixel", 12,7,"#ffffff"], ["pixel", 14,7,"#ffffff"], ["pixel", 17,7,"#ffffff"], ["pixel",
    19,7,"#ffffff"],'
  payload_switch: |-
    {
      "name" : "{{ appname }}"
    }
  payload_game_start: "{\n  \"draw\":[ \n    [\"rectFill\", 0,0,16,8,\"{{ team_colors_0 }}\"],     \n\
    \    [\"rectFill\", 16,0,16,8,\"{{ opponent_colors_0 }}\"], \n    [\"line\", 1,0,1,7,\"{{ team_colors_1\
    \ }}\"],\n    [\"line\", 3,0,3,7,\"{{ team_colors_1 }}\"],\n    [\"line\", 28,0,28,7,\"{{ opponent_colors_1\
    \ }}\"], \n    [\"line\", 30,0,30,7,\"{{ opponent_colors_1 }}\"], \n    {{ first_quarter }}\n    [\"\
    text\", 7, 1, \"{{ team_score }}\",[255,255,255]], \n    [\"text\", 18, 1, \"{{ opponent_score }}\"\
    ,[255,255,255]], \n    [\"line\", 15,3,16,3,\"#ffffff\"] \n  ], \n  \"durationMs\": {{ (message_duration\
    \ | float(0) * 1000) | int }} \n}"
  payload_second_quarter: "{\n  \"draw\":[ \n    [\"rectFill\", 0,0,16,8,\"{{ team_colors_0 }}\"],   \
    \  \n    [\"rectFill\", 16,0,16,8,\"{{ opponent_colors_0 }}\"], \n    [\"line\", 1,0,1,7,\"{{ team_colors_1\
    \ }}\"],\n    [\"line\", 3,0,3,7,\"{{ team_colors_1 }}\"],\n    [\"line\", 28,0,28,7,\"{{ opponent_colors_1\
    \ }}\"], \n    [\"line\", 30,0,30,7,\"{{ opponent_colors_1 }}\"], \n    {{ second_quarter }}\n   \
    \ [\"text\", 7, 1, \"{{ team_score }}\",[255,255,255]], \n    [\"text\", 18, 1, \"{{ opponent_score\
    \ }}\",[255,255,255]], \n    [\"line\", 15,3,16,3,\"#ffffff\"] \n  ], \n  \"durationMs\": {{ (message_duration\
    \ | float(0) * 1000) | int }} \n}"
  payload_third_quarter: "{\n  \"draw\":[ \n    [\"rectFill\", 0,0,16,8,\"{{ team_colors_0 }}\"],    \
    \ \n    [\"rectFill\", 16,0,16,8,\"{{ opponent_colors_0 }}\"], \n    [\"line\", 1,0,1,7,\"{{ team_colors_1\
    \ }}\"],\n    [\"line\", 3,0,3,7,\"{{ team_colors_1 }}\"],\n    [\"line\", 28,0,28,7,\"{{ opponent_colors_1\
    \ }}\"], \n    [\"line\", 30,0,30,7,\"{{ opponent_colors_1 }}\"], \n    {{ third_quarter }}\n    [\"\
    text\", 7, 1, \"{{ team_score }}\",[255,255,255]], \n    [\"text\", 18, 1, \"{{ opponent_score }}\"\
    ,[255,255,255]], \n    [\"line\", 15,3,16,3,\"#ffffff\"] \n  ], \n  \"durationMs\": {{ (message_duration\
    \ | float(0) * 1000) | int }} \n}"
  payload_fourth_quarter: "{\n  \"draw\":[ \n    [\"rectFill\", 0,0,16,8,\"{{ team_colors_0 }}\"],   \
    \  \n    [\"rectFill\", 16,0,16,8,\"{{ opponent_colors_0 }}\"], \n    [\"line\", 1,0,1,7,\"{{ team_colors_1\
    \ }}\"],\n    [\"line\", 3,0,3,7,\"{{ team_colors_1 }}\"],\n    [\"line\", 28,0,28,7,\"{{ opponent_colors_1\
    \ }}\"], \n    [\"line\", 30,0,30,7,\"{{ opponent_colors_1 }}\"], \n    {{ fourth_quarter }}\n   \
    \ [\"text\", 7, 1, \"{{ team_score }}\",[255,255,255]], \n    [\"text\", 18, 1, \"{{ opponent_score\
    \ }}\",[255,255,255]], \n    [\"line\", 15,3,16,3,\"#ffffff\"] \n  ], \n  \"durationMs\": {{ (message_duration\
    \ | float(0) * 1000) | int }} \n}"
trigger:
- platform: state
  entity_id:
  - !input 'my_sensor'
  to: IN
  id: Game Start
- platform: state
  entity_id:
  - !input 'my_sensor'
  to: POST
  id: Game End
- platform: state
  entity_id:
  - !input 'my_sensor'
  attribute: team_score
  id: Team Score Change
- platform: state
  entity_id:
  - !input 'my_sensor'
  attribute: opponent_score
  id: Opponent Score Change
- platform: state
  entity_id:
  - !input 'my_sensor'
  attribute: quarter
  id: Quarter Change
condition: []
action:
- repeat:
    for_each: '{{ devices }}'
    sequence:
    - choose:
      - conditions:
        - condition: trigger
          id:
          - Game Start
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_game_start }}'
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/switch'
            payload: '{{ payload_switch }}'
      - conditions:
        - condition: trigger
          id:
          - Quarter Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 1
          below: 3
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_second_quarter }}'
      - conditions:
        - condition: trigger
          id:
          - Quarter Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 2
          below: 4
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_third_quarter }}'
      - conditions:
        - condition: trigger
          id:
          - Quarter Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 3
          below: 5
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_fourth_quarter }}'
      - conditions:
        - condition: trigger
          id:
          - Team Score Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 0
          below: 2
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_game_start }}'
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/switch'
            payload: '{{ payload_switch }}'
      - conditions:
        - condition: trigger
          id:
          - Team Score Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 1
          below: 3
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_second_quarter }}'
      - conditions:
        - condition: trigger
          id:
          - Team Score Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 2
          below: 4
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_third_quarter }}'
      - conditions:
        - condition: trigger
          id:
          - Team Score Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 3
          below: 5
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_fourth_quarter }}'
      - conditions:
        - condition: trigger
          id:
          - Opponent Score Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 0
          below: 2
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_game_start }}'
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/switch'
            payload: '{{ payload_switch }}'
      - conditions:
        - condition: trigger
          id:
          - Opponent Score Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 1
          below: 3
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_second_quarter }}'
      - conditions:
        - condition: trigger
          id:
          - Opponent Score Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 2
          below: 4
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_third_quarter }}'
      - conditions:
        - condition: trigger
          id:
          - Opponent Score Change
        - condition: numeric_state
          entity_id: !input 'my_sensor'
          attribute: quarter
          above: 3
          below: 5
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{{ payload_fourth_quarter }}'
- repeat:
    for_each: '{{ devices }}'
    sequence:
    - choose:
      - conditions:
        - condition: trigger
          id:
          - Game End
        sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: '{{ repeat.item }}/cmd/apps/pushed/{{ appname }}'
            payload: '{}'
mode: restart
