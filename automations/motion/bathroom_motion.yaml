---
# yamllint disable rule:key-ordering
id: "00032"
alias: Bathroom Intelligent Lighting
mode: restart
description: Intelligent bathroom lighting with night mode and shower detection

triggers:
  - platform: state
    entity_id:
      - binary_sensor.bathroom_motion_detection
      - binary_sensor.ep1_bathroom_occupancy
      - binary_sensor.ep1_bathroom_mmwave
    to: "on"

# conditions:
#   - condition: state
#     entity_id: light.sink_light
#     state: "off"

actions:

#################################################
# VARIABLES (compute everything once)
#################################################

  - variables:

      someone_in_bed: >
        {{ is_state('binary_sensor.withings_in_bed_john','on')
           or is_state('binary_sensor.withings_in_bed_robert','on') }}

      night_light: >
        {{ ["light.bathroom_sink_1",
            "light.bathroom_sink_2",
            "light.bathroom_sink_3",
            "light.bathroom_sink_4"] | random }}

      night_mode: >
        {{ is_state('sun.sun','below_horizon') and someone_in_bed }}

      evening_mode: >
        {{ is_state('sun.sun','below_horizon') and not someone_in_bed }}

      shower_mode: >
        {{ is_state('binary_sensor.bathroom_shower_active','on') }}

#################################################
# DETERMINE TARGET LIGHT
#################################################

      target_light: >
        {% if night_mode %}
          {{ night_light }}
        {% else %}
          light.sink_light
        {% endif %}

#################################################
# DETERMINE BRIGHTNESS
#################################################

      brightness: >
        {% if night_mode %}
          10
        {% elif evening_mode and shower_mode %}
          120
        {% elif evening_mode %}
          75
        {% elif shower_mode %}
          200
        {% else %}
          255
        {% endif %}

#################################################
# DETERMINE COLOR TEMP
#################################################

      color_temp: >
        {{ 2200 if night_mode else (3800 if evening_mode else 4500) }}

#################################################
# DETERMINE TIMEOUT
#################################################

      timeout: >
        {{ "00:20:00" if shower_mode else "00:03:00" }}

#################################################
# TURN LIGHTS ON
#################################################

  - action: light.turn_on
    target:
      entity_id: "{{ target_light }}"
    data:
      brightness: "{{ brightness }}"
      color_temp_kelvin: "{{ color_temp }}"
      transition: 2


#################################################
# WAIT UNTIL ROOM EMPTY
#################################################

  - wait_for_trigger:
      - platform: state
        entity_id: binary_sensor.ep1_bathroom_occupancy
        to: "off"
        for: "{{ timeout }}"


#################################################
# TURN LIGHTS OFF
#################################################

  - action: light.turn_off
    target:
      entity_id: light.sink_light
    data:
      transition: 5