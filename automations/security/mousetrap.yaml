---
id: "00008"
alias: Mouse Trap Alarm
initial_state: true
trigger:
  - platform: state
    entity_id:
      - binary_sensor.mouse_trap_general_purpose
    to: "on"
    for:
      hours: 0
      minutes: 5
      seconds: 0
action:
  - action: mqtt.publish
    data:
      topic: awtrixng-4200c8/cmd/apps/pushed/mousetrap
      qos: 0
      retain: false
      payload: >-
        {{ {
          'text': 'Empty mousetrap',
          'icon': 'mouse',
          'textColor': '#FFBF00',
          'durationMs': 7000,
          'repeat': 1
        } | to_json }}

  - action: notify.persistent_notification
    data:
      message: Please empty the mousetrap as soon as possible
      title: Mouse Trap Alert

  - action: script.text_notify_all
    data_template:
      title: "🪤 Mouse Trap Alert"
      message: >-
        🐭 Please empty the mousetrap as soon as possible.
      data:
        subtitle: >-
          🪤 Mouse Trap Alert
