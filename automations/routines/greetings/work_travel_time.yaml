---
id: "00010"
alias: JE Travel Time
description: "Display time to drive to work based on Waze"
mode: single

trigger:
  - platform: time_pattern
    minutes: "/10"

condition: []

action:
  - if:
      - condition: state
        entity_id: binary_sensor.workday_sensor_2
        state: "on"
      - condition: time
        after: "05:00:00"
        before: "10:00:00"
    then:
      - service: mqtt.publish
        data:
          topic: awtrixng-4200c8/cmd/apps/pushed/je_work_travel
          qos: 0
          retain: false
          payload: >-
            {% set travel = states('sensor.home_to_work_travel') %}
            {% set display = ((travel | float | round(0) | int) ~ ' min')
               if is_number(travel) else 'Travel unavailable' %}
            {{ {
              "text": display,
              "textCase": "asTyped",
              "icon": "tmobile",
              "repeat": 2,
              "durationMs": 5000
            } | to_json }}
    else:
      - service: mqtt.publish
        data:
          topic: awtrixng-4200c8/cmd/apps/pushed/je_work_travel
          qos: 0
          retain: false
          payload: "{}"
