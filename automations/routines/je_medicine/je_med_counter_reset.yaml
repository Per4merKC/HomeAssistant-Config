---
id: "00044"
alias: "Meds: Phone Refill Handler"
description: "Catches text input from iOS notification and updates counter"
trigger:
  - platform: event
    event_type: ios.notification_action_fired
action:
  - variables:
      action_name: "{{ trigger.event.data.actionName | default('') }}"
      med_id: "{{ action_name.split('_')[1] | lower if '_' in action_name else '' }}"
      refill_amount: "{{ trigger.event.data.textInput | int(0) if trigger.event.data.textInput is defined else 0 }}"
      counter_entity: "counter.{{ med_id }}_medicine_counter"

  # Update the counter
  - action: counter.set_value
    target:
      entity_id: "{{ counter_entity }}"
    data:
      value: "{{ refill_amount }}"

  # Clear the notification from the phone screen
  - action: notify.mobile_app_john_iphone
    data:
      message: "clear_notification"
      data:
        tag: "refill_{{ med_id }}"