---
id: "00004"
alias: "JE Daily Meds Taken"
description: "Optimized meds tracker with centralized data object."

variables:
  # 1. CENTRALIZED DATA OBJECT
  # Define every attribute once here. 
  med_data:
    - { name: "Blood Pressure", id: "bp", threshold: 5, icon: "🩸", morning: true, evening: true }
    - { name: "Cholesterol", id: "cholesterol", threshold: 5, icon: "💊", morning: true, evening: false }
    - { name: "Potassium Citrate", id: "kcitrate", threshold: 20, icon: "💊", morning: true, evening: true, div: 2 }
    - { name: "Trintellix", id: "ttx", threshold: 5, icon: "🗣", morning: true, evening: false }
    - { name: "Wellbutrin", id: "wb", threshold: 5, icon: "🧠", morning: true, evening: false }

  # 2. STATE LOGIC
  is_morning: "{{ now() < today_at('18:15:00') }}"
  from_button: "{{ trigger.id == 't_00004_button' }}"
  
  # 3. DYNAMIC FILTERING
  # This creates a list of entity_ids for ONLY the meds that should be taken NOW
  target_counters: >
      {% set attr = 'morning' if is_morning else 'evening' %}
      {% set selected_ids = med_data | selectattr(attr, 'eq', true) | map(attribute='id') | list %}
      {% set ns = namespace(entities=[]) %}
      {% for med_id in selected_ids %}
        {% set ns.entities = ns.entities + ['counter.' ~ med_id ~ '_medicine_counter'] %}
      {% endfor %}
      {{ ns.entities }}

  response_var: >
    {{ [
        "Meds complete — John achieves +10 stability and +5 adulting skill.",
        "You took your meds! Your organs send their deepest gratitude.",
        "Pill successfully swallowed — human operating system updated.",
        "Meds onboard. Chaos denied entry… for now.",
        "Great job taking your meds — your body just whispered ‘thank you.’",
        "Mission accomplished: Pharmaceuticals deployed like tiny heroes.",
        "You took your meds! Future John now has a fighting chance.",
        "Meds taken — consider yourself officially less breakable.",
        "Congrats! You just unlocked the achievement: Responsible Human.",
        "Meds swallowed like a champion — hydration may now commence.",
        "Boom. Meds handled. A standing ovation from your cells.",
        "You took your meds — a brilliant tactical move against entropy.",
        "Medication installed. Please allow 4–6 hours for awesomeness.",
        "Meds secured — sleep easier knowing biology is obeying orders.",
        "John: 1. Biochemical rebellion: 0.",
        "Meds taken — the internal gremlins are disappointed.",
        "Congratulations — you just fed the microscopic workforce.",
        "Thank you for choosing Functionality™ — your meds are now active.",
        "Just like that, you prevented a full-scale cellular uprising.",
        "You took your meds — that’s the kind of hero we root for.",
        "Meds down the hatch — you may now proceed to be amazing.",
        "Pharmaceuticals applied. Consider yourself fortified.",
        "Well done — your organs are celebrating with a tiny dance party.",
        "You took your meds, John. Your mitochondria salute you.",
        "Meds complete — and not a single dramatic choking scene.",
        "Nice going — your health bar just got a little greener.",
        "Meds taken — look at you being all responsible and stuff.",
        "Your cells high-fived when that pill hit the stomach.",
        "Meds complete — please enjoy the improved performance boost.",
        "You took your meds! Your body approves this message.",
        "Success! Chemistry has entered the chat and likes what it sees."
    ] | random }}

trigger:
  - platform: event
    id: t_00004_ios
    event_type: ios.notification_action_fired
    event_data:
      actionName: JE_MEDS_TAKEN
  - platform: device
    id: t_00004_button
    device_id: 99d88e062470eadce3e5ff19acd21f62
    domain: zha
    type: remote_button_short_press
    subtype: turn_off

action:
  # 0. The "Gatekeeper" Condition
  - condition: state
    entity_id: input_boolean.je_medicine
    state: "off"
  # 1. Decrement Meds
  - action: counter.decrement
    target:
      entity_id: "{{ target_counters }}"

  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.je_medicine

  # 2. Feedback
  - action: script.text_notify_john
    data:
      title: "Thank You!"
      message: "{{ response_var }}"
      data: {}

  - action: notify.alexa_media
    data:
      message: "<audio src='soundbank://soundlibrary/computers/beeps_tones/beeps_tones_09'/> {{ response_var }}"
      target: media_player.bathroom_flex
      data:
        type: tts

  # 3. Low Inventory Check & Alert
  - repeat:
      for_each: "{{ med_data }}"
      sequence:
        - variables:
            med: "{{ repeat.item }}"
            entity: "counter.{{ repeat.item.id }}_medicine_counter"
            count: "{{ states(entity) | int(0) }}"
            doses: "{{ (count / repeat.item.div | default(1)) | int }}"
        
        - if: "{{ count < repeat.item.threshold }}"
          then:
            # Voice Alert
            - if: "{{ from_button }}"
              then:
                - action: notify.alexa_media
                  data:
                    message: "Your {{ repeat.item.name }} is low. {{ doses }} doses left."
                    target: media_player.bathroom_flex
                    data:
                      type: announce
            
            # Interactive Phone Alert (Allows text input!)
            - action: notify.mobile_app_john_iphone # <-- Update to your actual device ID
              data:
                title: "{{ repeat.item.icon }} {{ repeat.item.name }} Low"
                message: "Only {{ doses }} doses left."
                data:
                  tag: "refill_{{ repeat.item.id }}"
                  actions:
                    - action: "REFILL_{{ repeat.item.id | upper }}"
                      title: "Log Refill Amount"
                      behavior: textInput
                      textInputButtonTitle: "Save"
                      textInputPlaceholder: "Enter pill count (e.g. 90)"