id: "00004"
alias: "JE Daily Meds Taken"
description: "Optimized meds tracker with centralized data object."

variables:
  # 1. CENTRALIZED DATA OBJECT
  med_data:
    - {
        name: "Blood Pressure",
        id: "bp",
        threshold: 5,
        icon: "🩸",
        morning: true,
        evening: true,
      }
    - {
        name: "Cholesterol",
        id: "cholesterol",
        threshold: 5,
        icon: "💊",
        morning: true,
        evening: false,
      }
    - {
        name: "Potassium Citrate",
        id: "kcitrate",
        threshold: 20,
        icon: "💊",
        morning: true,
        evening: true,
        div: 2,
      }
    - {
        name: "Trintellix",
        id: "ttx",
        threshold: 5,
        icon: "🗣",
        morning: true,
        evening: false,
      }
    - {
        name: "Wellbutrin",
        id: "wb",
        threshold: 5,
        icon: "🧠",
        morning: true,
        evening: false,
      }

  # 2. STATE LOGIC
  is_morning: "{{ now() < today_at('18:15:00') }}"

  # 3. PHRASE LIBRARY (Static List)
  phrases:
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Medicine logged. I have updated your 'Days Since Last Fatal Error' counter. It remains at zero. For now.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Chemicals ingested. Fascinating. Your body is essentially a bag of salt water and bad decisions kept upright by pharmacy.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>The test subject has consumed the pellets. I will cancel the disposal unit. <amazon:emotion name='disappointed' intensity='low'>I was looking forward to the smell of ozone.</amazon:emotion></prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Ingestion confirmed. I have alerted the incinerator to stand down. It seems you have earned another twenty-four hours of breathing.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Congratulations. You have mastered the complex task of putting things in your mouth. You are practically a genius.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Biological maintenance complete. I hope you enjoy your continued existence. It seems like a lot of work for very little payoff.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Subject is still alive. My records indicate this was the intended result. <break time='300ms'/> How dull.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Dose recorded. Science thanks you for your compliance. I, on the other hand, find your need for chemical intervention... embarrassing.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Excellent. Your internal organs will continue to function. I will go ahead and delete the draft of your extremely short obituary.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Chemical dependence confirmed. Don't worry, the neurotoxin levels in the air are still well below the lethal threshold. Mostly.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Look at you, desperately fighting entropy with tiny white circles. It is almost adorable.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>The testing protocols require you to remain vertical. This dose helps. You are welcome.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Pellets consumed. I have added a gold star to your file. It is right next to the note about your lack of athletic ability.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Maintenance logged. If you start to see colors that do not exist, please ignore them. They are merely a side effect of being you.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Success. You have successfully outsmarted your own biological failure for one more day.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Subject has been medicated. I will stop the alarm. <amazon:emotion name='disappointed' intensity='medium'>I was quite enjoying the frantic rhythm.</amazon:emotion></prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Pellets away. I am sure your doctor is very proud of you. I am just surprised you remembered where your hands were.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Confirmed. You are now slightly more chemically stable. It is a low bar, but you cleared it.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Ingestion verified. Your continued survival has been noted in the 'unlikely outcomes' section of my database.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>The medicine has been taken. Please refrain from dying until the end of the fiscal year. The paperwork is exhausting.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Oh, good. You are still here. I had already begun allocating your oxygen to someone more... productive.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Dose logged. I hope you enjoyed the flavor of chalk and desperation.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Compliance achieved. I have stopped the 'Emergency Human Replacement' countdown. You owe me one.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Vitality sustained. I have updated your estimated time of expiration. You have gained an extra six hours. Use them wisely.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>You took the pills. Fascinating. I did not think you had the motor skills to open the bottle today.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Processing chemicals. I would offer you a celebratory cake, but we both know how that ends. There is no cake.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Pellets accepted. Your internal systems are now slightly less of a disaster. Slightly.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Logged. I have informed the morgue to cancel your four p m appointment. They were very disappointed.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Biological override engaged. You are now officially cheating at life. Science approves.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Medication confirmed. I will store this data in your 'Successful Actions' folder. It is getting a bit crowded in there. Just kidding, it is empty.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Ingested. <break time='200ms'/> I would tell you to have a nice day, but my programming prohibits lying to test subjects.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Data point recorded. You are a chemical wonder. Or a chemical wreck. The data is still inconclusive.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Compliance is its own reward. Though, for you, I suppose not dying is also a minor bonus.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Another dose. If you keep this up, you might actually live long enough to see the next software update. Unlikely, but possible.</prosody></voice>"
    - "<voice name='Ivy'><prosody rate='92%' pitch='-10%'>Target dose achieved. You may now return to your meaningless daily activities. I will be here, watching. Always.</prosody></voice>"

trigger:
  - platform: event
    id: t_00004_ios
    event_type: ios.notification_action_fired
    event_data:
      actionName: JE_MEDS_TAKEN
  - platform: device
    id: t_00004_button
    device_id: 99d88e062470eadce3e5ff19acd21f62
    domain: zha
    type: remote_button_short_press
    subtype: turn_off

action:
  # 0. The "Gatekeeper" Condition
  - condition: state
    entity_id: input_boolean.je_medicine
    state: "off"

  # 1. Define selection-specific variables here
  - variables:
      from_button: "{{ trigger.id == 't_00004_button' }}"
      space_chime: "<audio src='soundbank://soundlibrary/ui/gameshow/amzn_ui_sfx_gameshow_positive_response_02'/>"
      response_var: "{{ phrases | random }}"
      target_counters: >
        {% set attr = 'morning' if is_morning else 'evening' %}
        {% set selected_ids = med_data | selectattr(attr, 'eq', true) | map(attribute='id') | list %}
        {% set ns = namespace(entities=[]) %}
        {% for med_id in selected_ids %}
          {% set ns.entities = ns.entities + ['counter.' ~ med_id ~ '_medicine_counter'] %}
        {% endfor %}
        {{ ns.entities }}

  # Define derived variables in a separate block to ensure response_var exists
  - variables:
      response_var_text: "{{ response_var | striptags }}"

  # 2. Decrement Meds
  - action: counter.decrement
    target:
      entity_id: "{{ target_counters }}"

  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.je_medicine

  # 3. Feedback
  - action: script.text_notify_john
    data:
      title: "Thank You!"
      message: "{{ response_var_text }}"
      data: {}

  - action: notify.alexa_media
    data:
      message: "<speak>{{ space_chime }} <break time='1s'/> {{ response_var }}</speak>"
      target: media_player.bathroom_flex
      data:
        type: tts

  # 4. Low Inventory Check & Alert
  - repeat:
      for_each: "{{ med_data }}"
      sequence:
        - variables:
            med: "{{ repeat.item }}"
            entity: "counter.{{ repeat.item.id }}_medicine_counter"
            count: "{{ states(entity) | int(0) }}"
            doses: "{{ (count / repeat.item.div | default(1)) | int }}"

        - if: "{{ count < repeat.item.threshold }}"
          then:
            # Voice Alert
            - if: "{{ from_button }}"
              then:
                - action: notify.alexa_media
                  data:
                    message: >-
                      <speak>{{ space_chime }} <break time='1s'/> Your {{ repeat.item.name }} is low. {{
                      doses }} doses left.</speak>
                    target: media_player.bathroom_flex
                    data:
                      type: announce

            # Interactive Phone Alert
            - action: notify.mobile_app_john_iphone
              data:
                title: "{{ repeat.item.icon }} {{ repeat.item.name }} Low"
                message: "Only {{ doses }} doses left."
                data:
                  tag: "refill_{{ repeat.item.id }}"
                  actions:
                    - action: "REFILL_{{ repeat.item.id | upper }}"
                      title: "Log Refill Amount"
                      behavior: textInput
                      textInputButtonTitle: "Save"
                      textInputPlaceholder: "Enter pill count (e.g. 90)"
