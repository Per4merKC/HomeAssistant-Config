---
id: "00004"
alias: JE Daily Meds Taken
variables:
  response_var: >
    {{
      [ 
        "Meds complete — John achieves +10 stability and +5 adulting skill.",
        "You took your meds! Your organs send their deepest gratitude.",
        "Pill successfully swallowed — human operating system updated.",
        "Meds onboard. Chaos denied entry… for now.",
        "Great job taking your meds — your body just whispered ‘thank you.’",
        "Mission accomplished: Pharmaceuticals deployed like tiny heroes.",
        "You took your meds! Future John now has a fighting chance.",
        "Meds taken — consider yourself officially less breakable.",
        "Congrats! You just unlocked the achievement: Responsible Human.",
        "Meds swallowed like a champion — hydration may now commence.",
        "Boom. Meds handled. A standing ovation from your cells.",
        "You took your meds — a brilliant tactical move against entropy.",
        "Medication installed. Please allow 4–6 hours for awesomeness.",
        "Meds secured — sleep easier knowing biology is obeying orders.",
        "John: 1. Biochemical rebellion: 0.",
        "Meds taken — the internal gremlins are disappointed.",
        "Congratulations — you just fed the microscopic workforce.",
        "Thank you for choosing Functionality™ — your meds are now active.",
        "Just like that, you prevented a full-scale cellular uprising.",
        "You took your meds — that’s the kind of hero we root for.",
        "Meds down the hatch — you may now proceed to be amazing.",
        "Pharmaceuticals applied. Consider yourself fortified.",
        "Well done — your organs are celebrating with a tiny dance party.",
        "You took your meds, John. Your mitochondria salute you.",
        "Meds complete — and not a single dramatic choking scene.",
        "Nice going — your health bar just got a little greener.",
        "Meds taken — look at you being all responsible and stuff.",
        "Your cells high-fived when that pill hit the stomach.",
        "Meds complete — please enjoy the improved performance boost.",
        "You took your meds! Your body approves this message.",
        "Success! Chemistry has entered the chat and likes what it sees."
      ] | random
    }}
trigger:
  - platform: event
    id: t_00004_ios
    event_type: ios.notification_action_fired
    event_data:
      actionName: JE_MEDS_TAKEN
    context:
      user_id:
        - 58f909a7060b4eabb036e244d0369894
  - platform: device
    id: t_00004_button
    device_id: 99d88e062470eadce3e5ff19acd21f62
    domain: zha
    type: remote_button_short_press
    subtype: turn_off
action:
  - if:
      - alias: "Before 18:15"
        condition: time
        before: "18:15:00"
    then:
      - alias: "Decrement JE AM Meds"
        service: counter.decrement
        data: {}
        target:
          entity_id:
            - counter.bp_medicine_counter
            - counter.cholesterol_counter
            - counter.kcitrate_medicine_counter
            - counter.ttx_medicine_counter
            - counter.wb_medicine_counter
    else:
      - alias: "Decrement JE PM Meds"
        service: counter.decrement
        data: {}
        target:
          entity_id:
            - counter.bp_medicine_counter
            - counter.kcitrate_medicine_counter
  - service: input_boolean.turn_on
    entity_id: input_boolean.je_medicine

  - service: script.text_notify_john
    data_template:
      title: "Thank You!"
      message: "{{ response_var }}"
      data: {}
  - condition: trigger
    id: t_00004_button
  - service: notify.alexa_media
    data:
      # yamllint disable-line rule:line-length
      message: <audio src="soundbank://soundlibrary/computers/beeps_tones/beeps_tones_09"/> {{ response_var }}
      target: media_player.bathroom_flex
      data:
        type: tts

  # Blood Pressure (Losartan)
  - alias: Losartan is Low
    if:
      - condition: numeric_state
        entity_id: counter.bp_medicine_counter
        below: 5
    then:
      - if:
          - condition: trigger
            id: t_00004_button
        then:
          - service: notify.alexa_media
            data:
              message: >
                Your blood pressure prescription is low with
                {% if int(states("counter.bp_medicine_counter")) == 1 -%}
                  {{  states("counter.bp_medicine_counter") }} dose left.
                {%- else -%}
                  {{  states("counter.bp_medicine_counter") }} doses left.
                {%- endif %}
              target: media_player.bathroom_flex
              data:
                type: announce
      - service: notify.persistent_notification
        data:
          title: 🩸 Prescription Low
          message: >
            Your blood pressure prescription is low with
            {% if int(states("counter.bp_medicine_counter")) == 1 -%}
              {{  states("counter.bp_medicine_counter") }} dose left.
            {%- else -%}
              {{  states("counter.bp_medicine_counter") }} doses left.
            {%- endif %}

  # Cholesterol (Rosuvastatin)
  - alias: Rosuvastatin is Low
    if:
      - condition: numeric_state
        entity_id: counter.cholesterol_counter
        below: 5
    then:
      - if:
          - condition: trigger
            id: t_00004_button
        then:
          - service: notify.alexa_media
            data:
              message: >
                Your cholesterol prescription is low with
                {% if int(states("counter.cholesterol_counter")) == 1 -%}
                  {{  states("counter.cholesterol_counter") }} dose left.
                {%- else -%}
                  {{  states("counter.cholesterol_counter") }} doses left.
                {%- endif %}
              target: media_player.bathroom_flex
              data:
                type: announce
      - service: notify.persistent_notification
        data:
          title: 💊 Prescription Low
          message: >
            Your cholesterol prescription is low with
            {% if int(states("counter.cholesterol_counter")) == 1 -%}
              {{  states("counter.cholesterol_counter") }} dose left.
            {%- else -%}
              {{  states("counter.cholesterol_counter") }} doses left.
            {%- endif %}

  # Potassium Citrate
  - alias: Potassium Citrate is Low
    if:
      - condition: numeric_state
        entity_id: counter.kcitrate_medicine_counter
        below: 20  # double tablets per dose 2x Per day
    then:
      - if:
          - condition: trigger
            id: t_00004_button
        then:
          - service: notify.alexa_media
            data:
              # yamllint disable rule:line-length
              message: >
                Your potassium citrate prescription is low with
                {% if int(states("counter.kcitrate_medicine_counter")/2) == 1 -%}
                  {{  int(states("counter.kcitrate_medicine_counter")/2) }} dose left.
                {%- else -%}
                  {{  int(states("counter.kcitrate_medicine_counter")/2) }} doses left.
                {%- endif %}
              # yamllint enable rule:line-length
              target: media_player.bathroom_flex
              data:
                type: announce
      - service: notify.persistent_notification
        data:
          title: 💊 Prescription Low
          # yamllint disable rule:line-length
          message: >
            Your potassium citrate prescription is low with
            {% if int(states("counter.kcitrate_medicine_counter")/2) == 1 -%}
              {{  int(states("counter.kcitrate_medicine_counter")/2) }} dose left.
            {%- else -%}
              {{  int(states("counter.kcitrate_medicine_counter")/2) }} doses left.
            {%- endif %}
          # yamllint enable rule:line-length

  # Trintellix
  - alias: Trintellix is Low
    if:
      - condition: numeric_state
        entity_id: counter.ttx_medicine_counter
        below: 5
    then:
      - if:
          - condition: trigger
            id: t_00004_button
        then:
          - service: notify.alexa_media
            data:
              message: >
                Your Trintellix prescription is low with
                {% if int(states("counter.ttx_medicine_counter")) == 1 -%}
                  {{  states("counter.ttx_medicine_counter") }} dose left.
                {%- else -%}
                  {{  states("counter.ttx_medicine_counter") }} doses left.
                {%- endif %}
              target: media_player.bathroom_flex
              data:
                type: announce
      - service: notify.persistent_notification
        data:
          title: 🗣 Prescription Low
          message: >
            Your trintellix prescription is low with
            {% if int(states("counter.ttx_medicine_counter")) == 1 -%}
              {{  states("counter.ttx_medicine_counter") }} dose left.
            {%- else -%}
              {{  states("counter.ttx_medicine_counter") }} doses left.
            {%- endif %}

  # Wellbutrin
  - alias: Wellbutrin is Low
    if:
      - condition: numeric_state
        entity_id: counter.wb_medicine_counter
        below: 5
    then:
      - if:
          - condition: trigger
            id: t_00004_button
        then:
          - service: notify.alexa_media
            data:
              message: >
                Your Wellbutrin prescription is low with
                {% if int(states("counter.wb_medicine_counter")) == 1 -%}
                  {{  states("counter.wb_medicine_counter") }} dose left.
                {%- else -%}
                  {{  states("counter.wb_medicine_counter") }} doses left.
                {%- endif %}
              target: media_player.bathroom_flex
              data:
                type: announce
      - service: notify.persistent_notification
        data:
          title: 🧠 Prescription Low
          message: >
            Your wellbutrin prescription is low with
            {% if int(states("counter.wb_medicine_counter")) == 1 -%}
              {{  states("counter.wb_medicine_counter") }} dose left.
            {%- else -%}
              {{  states("counter.wb_medicine_counter") }} doses left.
            {%- endif %}
