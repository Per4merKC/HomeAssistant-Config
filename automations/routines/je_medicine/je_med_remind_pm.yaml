---
id: "00065"
alias: JE Medicine Reminder PM
initial_state: true
trigger:
  - platform: time_pattern
    minutes: "/15"
    seconds: "00"
condition:
  - condition: and
    conditions:
      - condition: state
        entity_id: input_boolean.je_medicine
        state: "off"
      - condition: time
        after: "18:30:00"
action:
  # AI-generated GLaDOS-style evening nag. continue_on_error keeps the
  # automation running if the conversation agent errors out or times out;
  # reminder_message below falls back to the static phrase library
  # whenever ai_response wasn't populated or came back empty. This is a
  # plain push notification (never announced via Alexa), so no SSML markup.
  - action: conversation.process
    continue_on_error: true
    data:
      agent_id: conversation.chatgpt
      text: >-
        You are GLaDOS from Portal, sarcastically reminding John that it is
        time to take his evening medication. Respond with one short, dry,
        dark-humor sentence in character. Plain text only — no markup, no
        quotation marks.
    response_variable: ai_response

  - variables:
      ai_text: >-
        {{ (ai_response.response.speech.plain.speech | trim)
           if (ai_response is defined and ai_response.response.speech.plain.speech is defined)
           else '' }}
      # yamllint disable rule:line-length
      reminder_message: >-
        {{ ai_text if (ai_text | length > 0) else ([
            "Evening meds time, John — because your body doesn't have a night shift crew.",
            "Take your meds so your dreams don’t turn into a CGI horror movie.",
            "Night meds: the sequel nobody asked for but everybody needs.",
            "Your evening meds are basically tiny lullabies. Swallow them gently.",
            "Take your meds — insomnia is not a personality trait.",
            "Night meds activate: unlock peaceful sleep DLC.",
            "Evening meds: because your cells need direction after 8pm.",
            "Take your meds, John — the moon is watching.",
            "Your meds are like vampires but healthy — they thrive at night.",
            "Night meds time: tuck those pills in bed… inside you.",
            "Take your meds so tomorrow isn’t sponsored by Regret™.",
            "Evening meds: for when your body says ‘plot twist!’",
            "John, the nighttime pharmaceutical council awaits your attendance.",
            "Meds time — let’s not roll the dice on nighttime chaos.",
            "Your evening meds want a sleepover — in your stomach.",
            "Take your meds, John — Future You already wrote you a thank-you note.",
            "Time to medicate like a responsible wizard.",
            "Night meds: the bedtime story your organs understand.",
            "Take your meds to avoid the ‘3 A.M. Brain Gremlins.’",
            "Your night meds help shut down tomorrow's nonsense early.",
            "Evening meds are like locking your doors — but for biology.",
            "Swallow those meds before your brain remembers things you said in 2008.",
            "Night meds: because Netflix isn’t the only thing you should binge responsibly.",
            "Take your meds — it’s cheaper than nocturnal panic.",
            "Your meds are begging to clock in for their night shift.",
            "Evening meds keep your inner goblins from hosting a rave.",
            "Take your meds or the nightmares win.",
            "Meds time: hydrate, swallow, dominate sleep.",
            "Night meds — the most adult thing you’ll do today.",
            "Take your meds so your body doesn’t attempt ‘surprise science.’",
            "Evening meds: because you deserve to respawn tomorrow with full health."
          ] | random) }}
      # yamllint enable rule:line-length

  - service: script.text_notify_john
    data:
      title: "Medication Alert!"
      message: "{{ reminder_message }}"
      data:
        actions:
          - action: "JE_MEDS_TAKEN"
            title: "Medication Taken"
            activationMode: "background"
            authenticationRequired: false
            destructive: false
            icon: "sfsymbols:pills"
          - action: "JE_MEDS_SNOOZE"
            title: "Snooze Medication"
            activationMode: "background"
            authenticationRequired: false
            destructive: false
            icon: "sfsymbols:powersleep"
