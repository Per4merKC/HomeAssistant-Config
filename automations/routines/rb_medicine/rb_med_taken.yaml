---
id: "00016"
alias: RB Medicine Taken
trigger:
  platform: event
  event_type: ios.notification_action_fired
  event_data:
    actionName: RB_MEDS_TAKEN
action:
  - action: conversation.process
    data:
      agent_id: conversation.chatgpt
      text: >-
        You are GLaDOS and are acknologing that Robert has taken his pills.
        Your response should be two sentences or less and use dark humor in
        the response.
    response_variable: response_var
  - service: script.text_notify_robert
    data_template:
      title: "Thank You!"
      message: "{{ response_var.response.speech.plain.speech }}"
      data: {}
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.rb_medicine
