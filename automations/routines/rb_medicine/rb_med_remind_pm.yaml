---
id: "00018"
alias: RB Medicine PM Reminder
initial_state: true
trigger:
  - platform: time_pattern
    minutes: "/15"
    seconds: "00"
condition:
  - condition: and
    conditions:
      - condition: state
        entity_id: input_boolean.rb_medicine
        state: "off"
      - condition: time
        after: "18:30:00"
action:
  - action: conversation.process
    data:
      agent_id: conversation.chatgpt
      text: >-
        Your objective is to get Robert to take his morning medicines.
        Your response should be two sentences or less and use dark
        humor in the response.
    response_variable: response_var
  - service: script.text_notify_robert
    data:
      title: "Medication Alert!"
      message: "{{ response_var.response.speech.plain.speech }}"
      data:
        actions:
          - action: "RB_MEDS_TAKEN"
            title: "Medicine Taken"
            activationMode: "background"
            authenticationRequired: false
            destructive: false
            icon: "sfsymbols:pills"
          - action: "RB_MEDS_SNOOZE"
            title: "Snooze 3 hrs."
            activationMode: "background"
            authenticationRequired: false
            destructive: false
            icon: "sfsymbols:powersleep"
