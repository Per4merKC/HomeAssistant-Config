---
id: "00005"
alias: "Bed Lights: Button 1 Press (On)"
description: >
  Single press of IKEA button 1 turns the bed lights on. Dim red if
  someone appears to be in bed (input_boolean.john_bed or
  binary_sensor.withings_in_bed_robert — swap these for whichever
  presence signal is actually authoritative), otherwise bright white.
trigger:
  # No `attribute: event_type` here on purpose: HA's attribute-scoped
  # state trigger only fires when that attribute's VALUE CHANGES from
  # its previous value. Two single presses in a row both report
  # event_type "multi_press_1" — same value twice — so the second
  # press would be silently swallowed. Watching the main state (a
  # fresh timestamp on every event) fires every time; the actual
  # event_type check happens in condition: below instead.
  - platform: state
    entity_id: event.ikea_led_buttons_button_1
condition:
  # Confirmed via live state 2026-08-09: this remote's event_types are
  # [multi_press_1, multi_press_2, long_press, long_release] — a single
  # click reports as multi_press_1, not a plain "press".
  - condition: template
    value_template: "{{ trigger.to_state.attributes.event_type == 'multi_press_1' }}"
action:
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: input_boolean.john_bed
                state: "on"
              - condition: state
                entity_id: binary_sensor.withings_in_bed_robert
                state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.ikea_led_striplights
            data:
              rgb_color: [255, 0, 0]
              brightness_pct: 15
    default:
      - action: light.turn_on
        target:
          entity_id: light.ikea_led_striplights
        data:
          color_temp_kelvin: 4000
          brightness_pct: 100
