---
id: "00081"
alias: "Bed Lights: Button 1 Hold (Brighten)"
description: >
  Holding button 1 ramps brightness up in 5% steps every 300ms until
  released. mode: restart is load-bearing here — it lets the
  hold_stop trigger interrupt the still-running hold_start repeat loop
  instantly instead of deadlocking behind it. Requires a helper toggle:
  input_boolean.bed_lights_brighten_hold. If the light is off when the
  hold starts, it's turned on first using the same bed-presence color
  logic as a single press, then brightens from there.
trigger:
  # See bed_lights_on.yaml for why attribute: event_type is intentionally
  # omitted from these triggers — it would silently drop an event whose
  # event_type repeats the previous value.
  - platform: state
    id: hold_start
    entity_id: event.ikea_led_buttons_button_1
  - platform: state
    id: hold_stop
    entity_id: event.ikea_led_buttons_button_1
condition:
  # Adjust 'long_press' / 'long_release' if Developer Tools -> States
  # shows different values for hold-start / hold-end on your remote.
  - condition: template
    value_template: >
      {{ (trigger.id == 'hold_start' and trigger.to_state.attributes.event_type == 'long_press')
         or (trigger.id == 'hold_stop' and trigger.to_state.attributes.event_type == 'long_release') }}
action:
  - choose:
      # --- Hold started ---
      - conditions: "{{ trigger.id == 'hold_start' }}"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bed_lights_brighten_hold
          - if: "{{ is_state('light.ikea_led_striplights', 'off') }}"
            then:
              - choose:
                  - conditions:
                      - condition: or
                        conditions:
                          - condition: state
                            entity_id: input_boolean.john_bed
                            state: "on"
                          - condition: state
                            entity_id: binary_sensor.withings_in_bed_robert
                            state: "on"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.ikea_led_striplights
                        data:
                          rgb_color: [255, 0, 0]
                          brightness_pct: 15
                default:
                  - action: light.turn_on
                    target:
                      entity_id: light.ikea_led_striplights
                    data:
                      color_temp_kelvin: 4000
                      brightness_pct: 15
          - repeat:
              while:
                - condition: state
                  entity_id: input_boolean.bed_lights_brighten_hold
                  state: "on"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: light.ikea_led_striplights
                  data:
                    brightness_step_pct: 5
                - delay:
                    milliseconds: 300
      # --- Hold released ---
      - conditions: "{{ trigger.id == 'hold_stop' }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bed_lights_brighten_hold
mode: restart
