---
id: "00019"
alias: "Bed Lights: Button 2 Press (Off)"
description: "Single press of IKEA button 2 turns the bed lights off."
trigger:
  # See bed_lights_on.yaml for why attribute: event_type is intentionally
  # omitted — it would silently drop repeated same-value presses.
  - platform: state
    entity_id: event.ikea_led_buttons_button_2
condition:
  # Confirmed via live state 2026-08-09: this remote's event_types are
  # [multi_press_1, multi_press_2, long_press, long_release] — a single
  # click reports as multi_press_1, not a plain "press".
  - condition: template
    value_template: "{{ trigger.to_state.attributes.event_type == 'multi_press_1' }}"
action:
  - action: light.turn_off
    target:
      entity_id: light.ikea_led_striplights
