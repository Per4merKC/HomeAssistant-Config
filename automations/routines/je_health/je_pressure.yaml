---
id: "00069"
alias: "JE: Blood Pressure Sync & Bio-Scan"
description: >
  Syncs BP to Habitica and Alexa always;
  AWTRIX only if no visitors.
mode: restart
trigger:
  - platform: state
    entity_id:
      - sensor.withings_diastolic_blood_pressure_mmhg_john
      - sensor.withings_systolic_blood_pressure_mmhg_john
condition:
  - condition: template
    # Ensure both numbers are valid before proceeding
    value_template: >
      {{
        is_number(states('sensor.withings_systolic_blood_pressure_mmhg_john'))
        and
        is_number(states('sensor.withings_diastolic_blood_pressure_mmhg_john'))
      }}
action:
  - variables:
      bp_top: "{{ states('sensor.withings_systolic_blood_pressure_mmhg_john') | float | round(1) }}"
      bp_bottom: "{{ states('sensor.withings_diastolic_blood_pressure_mmhg_john') | float | round(1) }}"
      bp_top_display: "{{ bp_top | round(0) | int }}"
      bp_bottom_display: "{{ bp_bottom | round(0) | int }}"

  # 1. CONDITIONAL: Update AWTRIX Display (Only if no visitors)
  - if:
      - condition: state
        entity_id: input_boolean.house_visitors
        state: "off"
    then:
      - service: mqtt.publish
        data:
          topic: awtrixng-4200c8/cmd/apps/pushed/JE_BP
          payload: |-
            {
              "text": "JE: {{ bp_top_display }}/{{ bp_bottom_display }}",
              "textCase": "asTyped",
              "icon": "blood-pressure",
              "repeat": 2,
              "durationMs": 5000
            }
          qos: 0
          retain: false

  # 2. ALWAYS: Mark Habitica Task Done
  - service: script.habitica_complete_daily
    data:
      task_id: CC03B5CF-2E22-4EA1-BACF-63D333FC74D9

  # 3. ALWAYS: Generate Dynamic AI Report via Gemini
  - service: conversation.process
    data:
      agent_id: conversation.google_generative_ai
      text: >-
        John Edmonds just synced his blood pressure.
        Reading: {{ bp_top_display }} over {{ bp_bottom_display }}.
        Act as a crisp, efficient medical bay AI on a spaceship.
        Provide a one-sentence verbal status update.
        Be technical, sci-fi, and humorous. No emojis. Use whole numbers only; no decimals.
        Response will be spoken so pronounce the blood pressure
        part as "120 over 80" for example.
    response_variable: gemini_response

  # 4. ALWAYS: Voice Announcement via Smart Notifications
  - service: script.alexa_smart_notifications
    data:
      message: "{{ gemini_response.response.speech.plain.speech }}"
      priority: "Normal"
      target: "bathroom"
