---
id: "00070"
alias: "JE: Weight Sync & Bio-Scan"
description: >
  Syncs weight to Habitica/Alexa always;
  AWTRIX only if no visitors.
mode: single
trigger:
  - platform: state
    entity_id: sensor.withings_weight_kg_john
condition:
  - condition: template
    value_template: "{{ is_number(trigger.to_state.state) }}"
action:
  - variables:
      current_w: "{{ trigger.to_state.state | float | round(1) }}"
      previous_w: "{{ (trigger.from_state.state | float | round(1)) if trigger.from_state is not none and is_number(trigger.from_state.state) else current_w }}"
      weight_delta: "{{ (current_w - previous_w) | round(1) }}"
      current_w_display: "{{ current_w | round(0) | int }}"
      weight_delta_display: "{{ weight_delta | round(0) | int }}"

  # 1. CONDITIONAL: Update AWTRIX Display (Only if no visitors)
  - if:
      - condition: state
        entity_id: input_boolean.house_visitors
        state: "off"
    then:
      - service: mqtt.publish
        data:
          topic: awtrixng-4200c8/cmd/apps/pushed/JE_Weight
          # yamllint disable rule:line-length
          payload: |-
            {
              "text": "JE: {{ current_w_display }} ({% if weight_delta_display <= 0 %}down {{ weight_delta_display | abs }}{% else %}up {{ weight_delta_display }}{% endif %})",
              "textCase": "asTyped",
              "icon": "weight",
              "repeat": 2,
              "durationMs": 5000
            }
          # yamllint enable rule:line-length
          qos: 0
          retain: false

  # 2. ALWAYS: Mark Habitica Task Done
  - service: script.habitica_complete_daily
    data:
      task_id: 5632C6E6-8AB4-4F11-B240-23282D958E4D

  # 3. ALWAYS: Generate Dynamic AI Report via Gemini
  - service: conversation.process
    data:
      agent_id: conversation.google_generative_ai
      text: >
        John Edmonds just completed a 'Weigh In'.
        Current mass: {{ current_w_display }} lbs. Delta: {{ weight_delta_display }} lbs.
        Act as a crisp, slightly snarky spaceship computer terminal.
        Provide a one-sentence verbal announcement acknowledging the sync and the trend.
        Keep it technical, sci-fi, and humorous. Use whole numbers only; no decimals.
    response_variable: gemini_response

  # 4. ALWAYS: Voice Announcement via Smart Notifications
  - service: script.alexa_smart_notifications
    data:
      message: "{{ gemini_response.response.speech.plain.speech }}"
      priority: "Normal"
      target: "bathroom"
