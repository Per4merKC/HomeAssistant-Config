---
id: "00011"
alias: "JE: Temperature Sync & Bio-Scan"
mode: single
trigger:
  - platform: state
    entity_id: sensor.withings_body_temperature_c_john
condition:
  - condition: template
    value_template: "{{ is_number(trigger.to_state.state) }}"
action:
  - variables:
      current_temp: "{{ trigger.to_state.state | float | round(1) }}"
      current_temp_display: "{{ current_temp | round(0) | int }}"

  - if:
      - condition: state
        entity_id: input_boolean.house_visitors
        state: "off"
    then:
      - service: mqtt.publish
        data:
          qos: 0
          retain: false
          topic: awtrixng-4200c8/cmd/apps/pushed/JE_TEMP
          payload: >-
            {
              "text": "JE: {{ current_temp_display }}°F",
              "textCase": "asTyped",
              "icon": "temperature",
              "repeat": 2,
              "durationMs": 5000
            }

  - service: script.habitica_complete_daily
    data:
      task_id: 3CA3C6B2-728C-420C-A558-5717A8AE7E43

  - service: conversation.process
    data:
      agent_id: conversation.google_generative_ai
      text: >-
        John synced body temp: {{ current_temp_display }}°F.
        Act as a spaceship medical AI with a sense of humor.
        One-sentence technical status update. Use whole numbers only; no decimals.
    response_variable: gemini_res

  - service: script.alexa_smart_notifications
    data:
      message: "{{ gemini_res.response.speech.plain.speech }}"
      priority: "Normal"
      target: "bathroom"
