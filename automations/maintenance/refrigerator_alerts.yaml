---
alias: "Refrigerator Alerts"
id: "00009"
description: "Alerts John and Robert if fridge stays out of safe range for 20m"
trigger:
  - platform: template
    value_template: >
      {% set current = states('sensor.refrigerator_temperature_air_temperature') | float(0) %}
      {% set target = state_attr('climate.kitchen_refrigerator', 'temperature') | float(37) %}
      {% set tolerance = states('input_number.refrigerator_tolerance') | float(0) %}
      {{ current > (target + tolerance + 5) }}
    for:
      minutes: 20
    id: "hot_alert"
  - platform: template
    value_template: >
      {% set current = states('sensor.refrigerator_temperature_air_temperature') | float(0) %}
      {% set target = state_attr('climate.kitchen_refrigerator', 'temperature') | float(37) %}
      {% set tolerance = states('input_number.refrigerator_tolerance') | float(0) %}
      {{ current < (target - tolerance - 5) }}
    for:
      minutes: 20
    id: "cold_alert"
action:
  - action: script.text_notify_all
    data:
      title: "🚨 Fridge Temperature Alert"
      message: >
        {% if trigger.id == 'hot_alert' %}
          The fridge is too warm! Current temp: {{ states('sensor.refrigerator_temperature_air_temperature') }}°F. Check the door.
        {% else %}
          The fridge is too cold! Current temp: {{ states('sensor.refrigerator_temperature_air_temperature') }}°F. Food may freeze.
        {% endif %}
      data:
        push:
          sound:
            name: "default"
            critical: 1
            volume: 1.0