---
id: "00074"
alias: "Duolingo: Adaptive Nag System"
trigger:
  - platform: time_pattern
    minutes: "/30" 
condition:
  # Check if John is home and if the current time matches your frequency logic
  - condition: state
    entity_id: device_tracker.john_phone
    state: "home"
  - condition: template
    value_template: >
      {% set hr = now().hour %}
      {% if hr >= 9 and hr < 18 %} {{ now().minute == 0 and hr % 2 == 0 }}
      {% elif hr >= 18 and hr < 21 %} {{ now().minute == 0 }}
      {% elif hr >= 21 and hr < 23 %} true
      {% else %} false {% endif %}
action:
  # 1. Force the sensor to update from the API only when needed
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.duolingo_streak

  # 2. Briefly wait for the API response
  - delay: "00:00:05"

  # 3. Proceed ONLY if the streak hasn't increased
  - if:
      - condition: template
        value_template: >
          {{ states('sensor.duolingo_streak') | int(0) <= states('input_number.duolingo_streak_baseline') | int(0) }}
    then:
      # Notifications (Phone & Alexa)
      - action: script.text_notify_john
        data:
          title: "🦉 Duolingo Reminder"
          message: "Your streak is still {{ states('sensor.duolingo_streak') }}. Practice now!"
      - if:
          - condition: time
            after: "18:00:00"
        then:
          - action: notify.alexa_media
            data:
              target: ["media_player.kitchen_show", "media_player.living_room_dot"] # etc
              message: "John, don't forget to practice."