---
id: "00066"
alias: Stock Ticker
description: "Display stock prices on AWTRIX"
mode: single
trigger:
  - platform: state
    entity_id:
      - sensor.yahoofinance_aapl
      - sensor.yahoofinance_icln
      - sensor.yahoofinance_schd
      - sensor.yahoofinance_xrt
      - sensor.yahoofinance_tmus
      - sensor.yahoofinance_mgc
    attribute: regularMarketPrice
condition: []
action:
  - variables:
      # take out the space from the join on the next line before production
      entity_list: >
        {{ states.sensor
        | selectattr('entity_id', 'search', '^sensor\\.yahoofinance')
        | map(attribute='entity_id') | join(', ') }}
  - repeat:
      count: "{{ entity_list.split(',') | length }}"
      sequence:
        - variables:
            # yamllint disable rule:line-length
            stock_icon: >-
              {% set icon_key = state_attr(entity_list.split(',')[repeat.index - 1]
              | trim, 'trending') %}
              {% set icon_values =
                {
                  "up": "arrowup",
                  "down": "arrowdown"
                }
              %}
              {{ icon_values.get(icon_key, '') }}
            # yamllint enable rule:line-length
        - service: mqtt.publish
          data:
            retain: false
            qos: 0
            # yamllint disable rule:line-length
            topic: >-
              {% set entity = entity_list.split(',')[repeat.index - 1] | trim %}
              {% set symbol = state_attr(entity, 'symbol') or entity.split('yahoofinance_', 1)[-1] | upper %}
              awtrixng-4200c8/cmd/apps/pushed/yahoofinance_{{ symbol }}
            payload: >-
              {% set entity = entity_list.split(',')[repeat.index - 1] | trim %}
              {% set symbol = state_attr(entity, 'symbol') or entity.split('yahoofinance_', 1)[-1] | upper %}
              {% set name = state_attr(entity, 'friendly_name') or symbol %}
              {% set currency = state_attr(entity, 'currencySymbol') or state_attr(entity, 'currency') or '' %}
              {% set price = state_attr(entity, 'regularMarketPrice') | float(none) %}
              {% if price is none %}
                {% set price = states(entity) | float(none) %}
              {% endif %}
              {% if price is none %}
                {% set display = name ~ ' (' ~ symbol ~ ') - Price unavailable' %}
              {% else %}
                {% set display = name ~ ' (' ~ symbol ~ ') - ' ~ currency ~ price %}
              {% endif %}
              {% set payload = {
                "durationMs": 10000,
                "text": display,
                "textOffsetX": 33
              } %}
              {% if stock_icon %}
                {% set payload = dict(payload, icon=stock_icon | string) %}
              {% endif %}
              {{ payload | to_json }}
            # yamllint enable rule:line-length
