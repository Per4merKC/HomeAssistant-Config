---
id: "00066"
alias: Stock Ticker
description: "Compact stock prices and daily changes on AWTRIX NG"
mode: single
trigger:
  - platform: state
    entity_id:
      - sensor.yahoofinance_aapl
      - sensor.yahoofinance_icln
      - sensor.yahoofinance_schd
      - sensor.yahoofinance_xrt
      - sensor.yahoofinance_tmus
      - sensor.yahoofinance_mgc
    attribute: regularMarketPrice
  - platform: time_pattern
    minutes: "/15"
condition: []
variables:
  change_threshold: 0.2
  scroll_speed: 100
  display_repeat: 1
  display_duration_ms: 10000
action:
  - repeat:
      for_each: >-
        {{ states.sensor
           | selectattr('entity_id', 'search', '^sensor\\.yahoofinance_')
           | map(attribute='entity_id') | list }}
      sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: >-
              {% set entity = repeat.item %}
              {% set symbol = state_attr(entity, 'symbol') or entity.split('yahoofinance_', 1)[-1] | upper %}
              awtrixng-4200c8/cmd/apps/pushed/yahoofinance_{{ symbol }}
            payload: >-
              {% set entity = repeat.item %}
              {% set symbol = state_attr(entity, 'symbol') or entity.split('yahoofinance_', 1)[-1] | upper %}
              {% set currency = state_attr(entity, 'currencySymbol') or state_attr(entity, 'currency') or '' %}
              {% set price = state_attr(entity, 'regularMarketPrice') | float(none) %}
              {% if price is none %}
                {% set price = states(entity) | float(none) %}
              {% endif %}
              {% set change = state_attr(entity, 'regularMarketChangePercent') | float(none) %}
              {% set previous_close = state_attr(entity, 'regularMarketPreviousClose') | float(none) %}
              {% if change is none and price is not none and previous_close is not none and previous_close > 0 %}
                {% set change = (price - previous_close) / previous_close * 100 %}
              {% endif %}
              {% set icon = 'stock-neutral' %}
              {% set color = '#FFFFFF' %}
              {% if price is none %}
                {% set display = symbol ~ ' Price unavailable' %}
              {% else %}
                {% set display = symbol ~ ' ' ~ currency ~ ('%.2f' | format(price)) %}
                {% if change is not none %}
                  {% set display = display ~ ' (' ~ ('%+.1f' | format(change | round(1) + 0.0)) ~ '%)' %}
                  {% if change > change_threshold %}
                    {% set icon = 'stock-up' %}
                    {% set color = '#24FF55' %}
                  {% elif change < -change_threshold %}
                    {% set icon = 'stock-down' %}
                    {% set color = '#FF3333' %}
                  {% endif %}
                {% endif %}
              {% endif %}
              {{ {
                'text': display,
                'textColor': color,
                'icon': icon,
                'durationMs': display_duration_ms,
                'repeat': display_repeat,
                'scroll': {'speed': scroll_speed}
              } | to_json }}
