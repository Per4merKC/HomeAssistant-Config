---
id: "00063"
alias: "Network Upload Speed"
description: ""
mode: single
trigger:
  - platform: time_pattern
    minutes: "20"
condition:
  - condition: state
    entity_id: light.living_room_awtrix_ng_matrix
    state: "on"
action:
  - service: mqtt.publish
    data:
      # yamllint disable rule:line-length
      payload: |-
        {
          "durationMs": 10000,
          "icon": "upload",
          "text": "Upload speed is {{ states('sensor.speedtest_upload') | float(0) | round(0) | int }} {{ state_attr('sensor.speedtest_upload', 'unit_of_measurement') or 'Mbit/s' }}",
          "textCase": "asTyped",
          "textOffsetX": 33
        }
      # yamllint enable rule:line-length
      qos: 0
      retain: false
      topic: awtrixng-4200c8/cmd/apps/pushed/speedtest_up
