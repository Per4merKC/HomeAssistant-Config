---
id: "00067"
alias: Ulanzi Raining Now
description: Shows that it is currently raining
trigger:
  entity_id:
    - sensor.netatmo_netatmo_outdoor_rain_guage_rain
    - sensor.netatmo_netatmo_outdoor_rain_guage_rain_last_hour
  platform: state
variables:
  rain_rate: >-
    {{
      states(
        "sensor.netatmo_netatmo_outdoor_rain_guage_rain_last_hour",
        rounded=true,
        with_unit=true
      )
    }}
  rain_text: "Raining {{ rain_rate }}/hour"
action:
  - if:
      - condition: numeric_state
        above: 0
        entity_id: sensor.netatmo_netatmo_outdoor_rain_guage_rain
    then:
      - service: mqtt.publish
        data:
          retain: false
          payload: |-
            {
              "durationMs": 10000,
              "icon": "umbrella",
              "overlay": "rain",
              "text": "{{ rain_text }}",
              "textOffsetX": 33
            }
          qos: 0
          topic: awtrixng-4200c8/cmd/apps/pushed/raining_now
    else:
      - service: mqtt.publish
        data:
          retain: false
          payload: "{}"
          qos: 0
          topic: awtrixng-4200c8/cmd/apps/pushed/raining_now
