---
id: "00046"
alias: AWTRIX Weather
description: shows the local weatherdata with the icon based on cloud service
trigger:
  - platform: state
    entity_id: weather.honey_haus
variables:
  weather_icon: >-
    {% set icon_key = states('weather.honey_haus') %}
    {% set icon_values =
      {
        "clear-night": "weather-clear-night",
        "cloudy": "cloud-cloudy-overcast",
        "exceptional": "exceptional",
        "fog": "weather-fog",
        "hail": "hail",
        "lightning-rainy": "lightningbolt",
        "lightning": "lightningbolt",
        "partlycloudy": "partly-cloudy",
        "pouring": "weather-rain-showers",
        "rainy": "weather-rain-showers",
        "snowy-rainy": "snowyrainy",
        "snowy": "snowflake",
        "sunny": "sun",
        "windy-variant": "windz",
        "windy": "windy"
      }
    %}
    {{ icon_values.get(icon_key, '') }}
  air_temp: >-
    {{ state_attr('weather.honey_haus', 'temperature') }}
    {{ state_attr('weather.honey_haus', 'temperature_unit') }}
  humid_info: >-
    {{ state_attr('weather.honey_haus', 'humidity') }}%
  wind_dir: >-
    {% set direction = [
      'N',
      'NNE',
      'NE',
      'ENE',
      'E',
      'ESE',
      'SE',
      'SSE',
      'S',
      'SSW',
      'SW',
      'WSW',
      'W',
      'WNW',
      'NW',
      'NNW',
      'N'
    ] %}
    {% set degree = state_attr('weather.honey_haus', 'wind_bearing')|float(0) %}
    {{ direction[ (( degree + 11.25) / 22.5) | int] }}
  wind_info: >-
    {{ state_attr('weather.honey_haus', 'wind_speed') | round }}
    {{ state_attr('weather.honey_haus', 'wind_speed_unit') }}
action:
  - service: mqtt.publish
    metadata: {}
    data:
      topic: awtrixng-4200c8/cmd/apps/pushed/HA_Weather
      # yamllint disable rule:line-length
      payload: >-
        {% set payload = {
          "text": "Temp: " ~ air_temp ~ " Humid: " ~ humid_info ~
                  " Wind: " ~ wind_info ~ " (" ~ wind_dir ~ ")",
          "textCase": "upper",
          "repeat": 2,
          "durationMs": 5000
        } %}
        {% if weather_icon %}
          {% set payload = dict(payload, icon=weather_icon | string) %}
        {% endif %}
        {{ payload | to_json }}
      # yamllint enable rule:line-length
      qos: 0
      retain: false
