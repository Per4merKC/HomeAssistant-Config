---
###############################################################################
# Laundry Package: Integrated Door Sensor & LG ThinQ State Mapping
###############################################################################
template:
  - binary_sensor:
      - device_class: power
        unique_id: 5fd9fa85-956d-42ef-b1c8-70463df49e96
        default_entity_id: binary_sensor.wash_active
        icon: >
          {% if states('binary_sensor.wash_active') == 'on' %}
            mdi:washing-machine
          {% else %}
            mdi:washing-machine-off
          {% endif %}
        name: Washing Machine Active
        state: "{{ states('sensor.laundry_power_switch_1')|float > 3000 }}"

input_select:
  washing_machine_status:
    name: "Washing Machine Status"
    icon: mdi:washing-machine
    options:
      - Idle
      - Running
      - Done

  dryer_status:
    name: "Dryer Status"
    icon: mdi:tumble-dryer
    options:
      - Idle
      - Running
      - Done

counter:
  laundry_queue:
    name: "Laundry Queue"
    initial: 0
    step: 1
    minimum: 0
    icon: mdi:tray-full

  washing_machine_pods:
    name: "Washing Machine Pods"
    initial: 0
    step: 1
    minimum: 0
    icon: mdi:pill

automation:
  # 1. WASHER START (Triggered by Power > 3000)
  - id: "00022"
    alias: "Laundry: Washer Started"
    trigger:
      - platform: state
        entity_id: binary_sensor.wash_active
        to: "on"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.washing_machine_status
        data:
          option: Running
      - service: scene.create
        data:
          scene_id: before_wash
          snapshot_entities: [light.east_lamp]
      - service: light.turn_on
        target:
          entity_id: light.east_lamp
        data:
          brightness_pct: 30
          color_name: blue
      - service: counter.decrement
        target:
          entity_id: counter.washing_machine_pods
      - service: mqtt.publish
        data:
          topic: "awtrix_4200c8/custom/washer"
          payload: >
            {
              "text": "Washing machine running...",
              "icon": 24502,
              "repeat": 2,
              "duration": 5
            }

  # 2. WASHER DONE (Triggered by Power < 3000 for 2 min)
  - id: "00023"
    alias: "Laundry: Washer Finished"
    trigger:
      - platform: state
        entity_id: binary_sensor.wash_active
        to: "off"
        for:
          minutes: 2
    conditions:
      - condition: state
        entity_id: input_select.washing_machine_status
        state: "Running"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.washing_machine_status
        data:
          option: Done
      - service: counter.increment
        target:
          entity_id: counter.laundry_queue
      - service: light.turn_on
        target:
          entity_id: light.east_lamp
        data:
          effect: "Pulse"
          # brightness_pct: 80
          # color_name: orange
      - service: mqtt.publish
        data:
          topic: "awtrix_4200c8/custom/washer"
          payload: "{}"

      - service: ai_task.generate_data
        continue_on_error: true
        data:
          entity_id: ai_task.google_ai_announcements
          task_name: "Laundry Encouragement"
          instructions: >
            The washing machine finished.
            {{ states('counter.laundry_queue') }} loads are waiting in queue to be dried.
            Give a clever encouragement to move them in english.
            Use SSML markup <emphasis> and <prosody> to make it more engaging.
            CRITICAL: Return ONLY the raw SSML code starting with <speak> and ending with </speak>.
            Do not include any introductory text, markdown formatting, backticks, or explanations.
            Use 25 words or less.
        response_variable: wash_done_message

      - service: script.alexa_smart_notifications
        data:
          title: "Washer Finished"
          message: >-
            {% if wash_done_message is defined and wash_done_message.data is defined %}
              {{ wash_done_message.data }}
            {% else %}
              <speak>The dryer is done. Your clothes are warm and ready to be folded.</speak>
            {% endif %}
          target: ALL

      - service: script.text_notify_all
        data:
          title: "Laundry Alert"
          message: "The washing machine is done. {{ states('counter.laundry_queue') }} loads are waiting to be dried."
          data: {}

  # 3. DRYER START (Triggered by LG Run State 'Drying')
  - id: "00029"
    alias: "Laundry: Dryer Started"
    trigger:
      - platform: state
        entity_id: sensor.clothes_dryer_run_state
        to: "Drying"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.washing_machine_status
        data:
          option: Idle
      - service: input_select.select_option
        target:
          entity_id: input_select.dryer_status
        data:
          option: Running
      - service: counter.decrement
        target:
          entity_id: counter.laundry_queue
      - service: scene.create
        data:
          scene_id: before_dry
          snapshot_entities: [light.west_lamp]
      - service: light.turn_on
        target:
          entity_id: light.west_lamp
        data:
          brightness_pct: 80
          color_name: blue
      - service: mqtt.publish
        data:
          topic: "awtrix_4200c8/custom/dryer"
          payload: >
            {
              "text": "Dryer running...",
              "icon": 24504,
              "repeat": 2,
              "duration": 5
            }

      # Concurrency Fix: Only clear the washer light if the washer is actually idle
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.wash_active
                state: "on"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.washing_machine_status
                data:
                  option: Running
              - service: light.turn_on
                target:
                  entity_id: light.east_lamp
                data:
                  brightness_pct: 30
                  color_name: blue
        default:
          - service: input_select.select_option
            target:
              entity_id: input_select.washing_machine_status
            data:
              option: Idle
          - service: scene.turn_on
            target:
              entity_id: scene.before_wash

  # 4. DRYER DONE (Triggered by LG Dry Completed)
  - id: "00030"
    alias: "Laundry: Dryer Finished"
    trigger:
      - platform: state
        entity_id: binary_sensor.clothes_dryer_dry_completed
        to: "on"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.dryer_status
        data:
          option: Done
      - service: light.turn_on
        target:
          entity_id: light.west_lamp
        data:
          effect: "Pulse"
          # brightness_pct: 80
          # color_name: orange
      - service: ai_task.generate_data
        continue_on_error: true
        data:
          entity_id: ai_task.google_ai_announcements
          task_name: "Dryer Done Announcement"
          instructions: >
            The dryer is done.
            Give a clever encouragement to fold the warm clothes in English.
            Use SSML markup <emphasis> and <prosody> to make it more engaging.
            CRITICAL: Return ONLY the raw SSML code starting with <speak> and ending with </speak>.
            Do not include any introductory text, markdown formatting, backticks, or explanations.
            Use 25 words or less.
        response_variable: dryer_done_message

      - service: script.alexa_smart_notifications
        data:
          message: >-
            {% if dryer_done_message is defined and dryer_done_message.data is defined %}
              {{ dryer_done_message.data }}
            {% else %}
              <speak>The dryer is done. Your clothes are warm and ready to be folded.</speak>
            {% endif %}
          target: ALL

      - service: script.text_notify_all
        data:
          title: "Dryer Finished"
          message: "The dryer is done. Time to fold the clothes!"
          data: {}
      - service: mqtt.publish
        data:
          topic: "awtrix_4200c8/custom/dryer"
          payload: "{}"

  # 5. DRYER DOOR: The Cleanup Trigger
  - id: "00033"
    alias: "Laundry: Dryer Emptied"
    trigger:
      - platform: state
        entity_id: binary_sensor.dryer_door_open
        to: "on"
    condition:
      - condition: state
        entity_id: input_select.dryer_status
        state: "Done"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.dryer_status
        data:
          option: Idle
      - service: scene.turn_on
        target:
          entity_id: scene.before_dry

  # 6. WASHER NAG (Periodic Reminder)
  - id: "00024"
    alias: "Laundry: Washer Move Reminder (Nag)"
    trigger:
      - platform: time_pattern
        minutes: "/20"
    condition:
      # Only nag if the washer is done and the dryer isn't already running
      - condition: state
        entity_id: input_select.washing_machine_status
        state: "Done"
      - condition: state
        entity_id: input_select.dryer_status
        state: "Idle"
      - condition: numeric_state
        entity_id: counter.laundry_queue
        above: 0
    action:
      - service: ai_task.generate_data
        continue_on_error: true
        data:
          entity_id: ai_task.google_ai_announcements
          task_name: "Laundry Nag"
          instructions: >
            The washing machine finished a while ago and clothes are still sitting there.
            There are {{ states('counter.laundry_queue') }} loads waiting.
            Give a witty, slightly "nagging" encouragement to move them to the dryer.
            Use SSML markup <emphasis> and <prosody>.
            CRITICAL: Return ONLY raw SSML starting with <speak>.
            25 words or less.
        response_variable: nag_message

      - service: script.alexa_smart_notifications
        data:
          title: "Laundry Still Waiting"
          message: >-
            {% if nag_message is defined and nag_message.data is defined %}
              {{ nag_message.data }}
            {% else %}
              <speak>Friendly reminder: laundry is still waiting in the washer.</speak>
            {% endif %}
          target: ALL

      - service: script.text_notify_all
        data:
          title: "Laundry Nag"
          message: "Don't forget the laundry! {{ states('counter.laundry_queue') }} load(s) still in the washer."
          data: {}
