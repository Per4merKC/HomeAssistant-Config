---
# -------------------------------------------------------------------------
# INSTAGRAM ECOSYSTEM
# Follower fetching, daily change, milestone notifications, and AWTRIX NG
# -------------------------------------------------------------------------

sensor:
  - platform: rest
    name: instagram_followers
    unique_id: 15b3405a-e79c-40bc-b587-39ab5778b3cd
    resource_template: !secret ig_url
    method: GET
    headers:
      content-type: "application/json"
      user-agent: "Instagram 76.0.0.15.395 Android (24/7.0; 640dpi; 1440x2560; samsung; SM-G930F; herolte; samsungexynos8890; en_US; 138226743)"
    value_template: "{{ value_json.data.user.edge_followed_by.count }}"
    scan_interval: 7200

template:
  # This sensor restores its previous value after a Home Assistant restart.
  # If Instagram is unavailable at midnight, preserve the previous baseline.
  - trigger:
      - platform: time
        at: "00:00:00"
    sensor:
      - name: "Instagram Followers at Midnight"
        unique_id: 15b3405a-e79c-40bc-b587-39ab5778b3ce
        state: >-
          {% set current = states('sensor.instagram_followers') %}
          {{ current | int if is_number(current) else this.state }}
        unit_of_measurement: "followers"

  - sensor:
      - name: "Instagram Daily Change"
        unique_id: 15b3405a-e79c-40bc-b587-39ab5778b3cf
        state: >-
          {% set current = states('sensor.instagram_followers') %}
          {% set baseline = states('sensor.instagram_followers_at_midnight') %}
          {% if is_number(current) and is_number(baseline) %}
            {{ (current | int) - (baseline | int) }}
          {% else %}
            {{ none }}
          {% endif %}
        unit_of_measurement: "followers"

automation:
  - alias: "AWTRIX: Display Instagram Followers"
    id: "000076"
    description: >-
      Publish follower updates, refresh the daily baseline, and restore
      the pushed app within five minutes after an AWTRIX restart.
    trigger:
      - platform: state
        entity_id: sensor.instagram_followers
        to: null

      - platform: state
        entity_id: sensor.instagram_followers_at_midnight
        to: null

      - platform: time_pattern
        minutes: "/5"

    # Existing valid-reading check, also used for scheduled refreshes.
    condition:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.instagram_followers')) }}

    action:
      - service: mqtt.publish
        data:
          qos: 0
          retain: false
          topic: awtrixng-4200c8/cmd/apps/pushed/instagram
          payload: >-
            {% set current = states('sensor.instagram_followers') | int(none) %}
            {% set baseline = states('sensor.instagram_followers_at_midnight') | int(none) %}
            {% if current is none %}
              {% set display = 'Instagram unavailable' %}
            {% elif baseline is not none %}
              {% set change = current - baseline %}
              {% set sign = '+' if change >= 0 else '' %}
              {% set display = current ~ " (" ~ sign ~ change ~ ")" %}
            {% else %}
              {% set display = current | string %}
            {% endif %}
            {{ {
              "icon": "instagram",
              "text": display,
              "durationMs": 5000
            } | to_json }}

  - alias: "Instagram: Milestone & Smart Notifications"
    id: "00077"
    trigger:
      - platform: state
        entity_id: sensor.instagram_followers
        to: null

    condition:
      - condition: template
        value_template: >-
          {% set previous = trigger.from_state.state
             if trigger.from_state is not none else none %}
          {% set current = trigger.to_state.state
             if trigger.to_state is not none else none %}
          {% set new = current | int(0) %}
          {% set old = previous | int(new) %}
          {{ (new // 100) > (old // 100) }}

    action:
      - service: script.text_notify_john
        data:
          title: "Instagram Milestone!"
          message: >-
            {% set current = trigger.to_state.state | int %}
            {% set baseline = states('sensor.instagram_followers_at_midnight') %}
            You've reached {{ current }} followers.
            {% if is_number(baseline) %}
              {% set change = current - (baseline | int) %}
              Daily change: {{ '+' if change >= 0 else '' }}{{ change }}.
            {% endif %}
          data: []

      - if:
          - condition: state
            entity_id: person.john
            state: "home"
        then:
          - service: script.alexa_smart_notifications
            data:
              target: "John"
              priority: "Normal"
              message: >-
                Congratulations John, your Instagram just hit
                {{ trigger.to_state.state }} followers.
