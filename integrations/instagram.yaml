---
# -------------------------------------------------------------------------
# INSTAGRAM ECOSYSTEM
# Follower fetching, daily change, milestone notifications, and AWTRIX NG
# -------------------------------------------------------------------------

# Fetching is scheduled below; loading this command does not contact Instagram.
rest_command:
  instagram_followers_fetch:
    url: !secret ig_url
    method: GET
    headers:
      content-type: "application/json"
      user-agent: "Instagram 76.0.0.15.395 Android (24/7.0; 640dpi; 1440x2560; samsung; SM-G930F; herolte; samsungexynos8890; en_US; 138226743)"

template:
  # Time triggers only: no request at startup or on template reload.
  # This trigger-based sensor restores its last state after a restart.
  - trigger:
      - platform: time
        at:
          - "00:05:00"
          - "06:05:00"
          - "12:05:00"
          - "18:05:00"
    action:
      - action: rest_command.instagram_followers_fetch
        response_variable: instagram_response
        continue_on_error: true
    sensor:
      - name: "Instagram Followers Scheduled"
        default_entity_id: sensor.instagram_followers_scheduled
        unique_id: instagram_followers_scheduled
        unit_of_measurement: "followers"
        state: >-
          {% set response = instagram_response | default({}) %}
          {% set body = response.get('content', {}) if response is mapping else {} %}
          {% set body = body if body is mapping else body | from_json({}) %}
          {% set data = body.get('data', {}) if body is mapping else {} %}
          {% set user = data.get('user', {}) if data is mapping else {} %}
          {% set followed = user.get('edge_followed_by', {}) if user is mapping else {} %}
          {% set count = followed.get('count') if followed is mapping else none %}
          {% set status = response.get('status') if response is mapping else none %}
          {{ count | int if status == 200 and is_number(count) else this.state }}
        attributes:
          last_attempt: "{{ now().isoformat() }}"
          last_http_status: >-
            {% set response = instagram_response | default({}) %}
            {{ response.get('status', 'request_failed') if response is mapping else 'request_failed' }}

  # This sensor restores its previous value after a Home Assistant restart.
  # If Instagram is unavailable at midnight, preserve the previous baseline.
  - trigger:
      - platform: time
        at: "00:00:00"
    sensor:
      - name: "Instagram Followers at Midnight"
        unique_id: 15b3405a-e79c-40bc-b587-39ab5778b3ce
        state: >-
          {% set current = states('sensor.instagram_followers_scheduled') %}
          {{ current | int if is_number(current) else this.state }}
        unit_of_measurement: "followers"

  - sensor:
      - name: "Instagram Daily Change"
        unique_id: 15b3405a-e79c-40bc-b587-39ab5778b3cf
        state: >-
          {% set current = states('sensor.instagram_followers_scheduled') %}
          {% set baseline = states('sensor.instagram_followers_at_midnight') %}
          {% if is_number(current) and is_number(baseline) %}
            {{ (current | int) - (baseline | int) }}
          {% else %}
            {{ none }}
          {% endif %}
        unit_of_measurement: "followers"

automation:
  - alias: "AWTRIX: Display Instagram Followers"
    id: "000076"
    description: >-
      Publish follower updates, refresh the daily baseline, and restore
      the pushed app within five minutes after an AWTRIX restart.
    trigger:
      - platform: state
        entity_id: sensor.instagram_followers_scheduled
        to: null

      - platform: state
        entity_id: sensor.instagram_followers_at_midnight
        to: null

      - platform: time_pattern
        minutes: "/5"

    # Existing valid-reading check, also used for scheduled refreshes.
    condition:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.instagram_followers_scheduled')) }}

    action:
      - service: mqtt.publish
        data:
          qos: 0
          retain: false
          topic: awtrixng-4200c8/cmd/apps/pushed/instagram
          payload: >-
            {% set current = states('sensor.instagram_followers_scheduled') | int(none) %}
            {% set baseline = states('sensor.instagram_followers_at_midnight') | int(none) %}
            {% if current is none %}
              {% set display = 'Instagram unavailable' %}
            {% elif baseline is not none %}
              {% set change = current - baseline %}
              {% set sign = '+' if change >= 0 else '' %}
              {% set display = current ~ " (" ~ sign ~ change ~ ")" %}
            {% else %}
              {% set display = current | string %}
            {% endif %}
            {{ {
              "icon": "instagram",
              "text": display,
              "durationMs": 5000
            } | to_json }}

  - alias: "Instagram: Milestone & Smart Notifications"
    id: "00077"
    trigger:
      - platform: state
        entity_id: sensor.instagram_followers_scheduled
        to: null

    condition:
      - condition: template
        value_template: >-
          {% set previous = trigger.from_state.state
             if trigger.from_state is not none else none %}
          {% set current = trigger.to_state.state
             if trigger.to_state is not none else none %}
          {% set new = current | int(0) %}
          {% set old = previous | int(new) %}
          {{ (new // 100) > (old // 100) }}

    action:
      - service: script.text_notify_john
        data:
          title: "Instagram Milestone!"
          message: >-
            {% set current = trigger.to_state.state | int %}
            {% set baseline = states('sensor.instagram_followers_at_midnight') %}
            You've reached {{ current }} followers.
            {% if is_number(baseline) %}
              {% set change = current - (baseline | int) %}
              Daily change: {{ '+' if change >= 0 else '' }}{{ change }}.
            {% endif %}
          data: []

      - if:
          - condition: state
            entity_id: person.john
            state: "home"
        then:
          - service: script.alexa_smart_notifications
            data:
              target: "John"
              priority: "Normal"
              message: >-
                Congratulations John, your Instagram just hit
                {{ trigger.to_state.state }} followers.
